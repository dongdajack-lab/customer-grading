<style>

  .percent-circle .num { font-size:36px; font-weight:700; color:#5E35B1; line-height:1; }

<body>

<header>
  <h1>大董老师 · 介绍练习</h1>
  <p>FABE产品价值呈现训练 · 共16题</p>
  <span class="company-tag">💡 宇凡微电子 · 单片机方案与合封定制</span>
  <span class="custom-tag">★ 企业定制</span>
</header>

<div class="container">
  <div id="quizPage">
    <div class="tip-box">
      <strong>FABE 公式：</strong>先讲 <strong>F（特征）</strong>产品本身的属性 → <strong>A（优势）</strong>与竞品相比的优势 → <strong>B（利益）</strong>给客户带来的好处 → <strong>E（证明）</strong>用案例/数据/证据证明
    </div>
    <div class="progress-text" id="progressText"></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="fabe-hint">
      <span class="fabe-tag tag-F">F 特征</span>
      <span class="fabe-tag tag-A">A 优势</span>
      <span class="fabe-tag tag-B">B 利益</span>
      <span class="fabe-tag tag-E">E 证明</span>
    </div>
    <div class="card" id="questionCard"></div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="btnPrev" onclick="prevQ()" disabled>上一题</button>
      <button class="btn btn-primary" id="btnNext" onclick="nextQ()" disabled>确认答案</button>
    </div>
  </div>

  <div class="result-page" id="resultPage">
    <div class="score-circle">
      <span class="num" id="scoreNum">0</span>
      <span class="sub">正确 / 16 题</span>
    </div>
    <div class="percent-circle">
      <span class="num" id="percentNum">0</span>
      <span class="unit">分</span>
      <span class="sub-label">百分制</span>
    </div>
    <div class="result-detail" id="resultDetail"></div>
    <button class="restart-btn" onclick="restart()">再来一次</button>
  </div>
</div>

<script>
const questions = [
  {
    "scenario": "你是宇凡微的销售工程师，正在向某电动牙刷厂商（年出货500万台）的采购总监和研发经理介绍主控芯片方案。该厂商新款声波电动牙刷正在选型主控。",
    "question": "下面四句话，哪一句是 <strong>F - 特征</strong>（产品/服务本身的属性/规格）？",
    "options": [
      {
        "text": "宇凡微YF系列8位单片机，SOP8/SSOP24等封装可选，内置EEPROM、PWM与10位ADC，工作电压1.8-5.5V；支持把MCU与驱动器件、存储芯片合封成单颗定制芯片；方案侧由80余人的工程师团队提供从原理图、参考固件、样机调试到量产测试程序的全流程支持；自有封装测试产线，日产能100万颗。",
        "type": "F",
        "correct": true
      },
      {
        "text": "相比直接从原厂买标准MCU再自己搭外围电路，合封定制能把外围器件从七八颗减到一两颗；而且方案、固件、测试程序全包，原厂只给芯片不给方案。",
        "type": "A",
        "correct": false
      },
      {
        "text": "用了宇凡微的方案，贵司单机BOM成本能降10%-15%，开发周期从3个月压到4-6周，新品能提前一个季度上市抢市场。",
        "type": "B",
        "correct": false
      },
      {
        "text": "宇凡微服务过美的、小米、九阳等800多个品牌，持有42项发明专利、6项集成电路布图设计，是国家级专精特新企业。",
        "type": "E",
        "correct": false
      }
    ],
    "explain": "<strong>✅ F - 特征</strong><br><br>特征是客观描述产品本身的属性——封装规格、内置资源、工作电压、合封能力、方案支持内容、产能。这些都是宇凡微方案的客观规格，不涉及比较和利益。<br><br>A是与标准芯片方案的对比优势；B是给客户带来的好处；E是企业资质与客户案例背书。"
  },
  {
    "scenario": "研发经理说：我们现在用的是某台系原厂的标准MCU，自己搭外围电路，方案自己写。你们比这个强在哪？",
    "question": "下面哪一句是 <strong>A - 优势</strong>（与现有方案相比的优势）？",
    "options": [
      {
        "text": "相比原厂标准MCU加自搭外围，宇凡微有三个核心差异：一是合封定制——MCU与驱动、存储合封成一颗，外围器件从七八颗减到一两颗，贴片工序和故障点同步减少；二是方案全包——原理图、固件、测试程序全部交付，原厂只给芯片，方案得自己烧钱养团队写；三是供应灵活——从试产几千颗到爬坡几十万颗都能接，日产能100万颗兜底，原厂大客户优先、小体量客户排期靠后。",
        "type": "A",
        "correct": true
      },
      {
        "text": "宇凡微YF系列8位单片机，SOP8/SSOP24封装，内置EEPROM、PWM与10位ADC，支持合封定制。",
        "type": "F",
        "correct": false
      },
      {
        "text": "用了我们的方案，BOM成本降10%-15%，开发周期从3个月压到4-6周。",
        "type": "B",
        "correct": false
      },
      {
        "text": "宇凡微服务过美的、小米、九阳等800多个品牌，日产能100万颗。",
        "type": "E",
        "correct": false
      }
    ],
    "explain": "<strong>✅ A - 优势</strong><br><br>优势是「比现有方案强在哪」——合封减外围、方案全包、供应灵活。这三点精准针对「自己搭外围+自己写方案+小体量排期吃亏」三个痛点。研发经理最关心开发工作量，A要打在「方案全包」上。<br><br>F讲规格、B讲好处、E讲案例。"
  },
  {
    "scenario": "采购总监问：方案和供应我认可，但我要的是实际好处——换你们，我们公司到底能得到什么？",
    "question": "下面哪一句是 <strong>B - 利益</strong>（给客户带来的实际好处）？",
    "options": [
      {
        "text": "换宇凡微，贵司三笔账都变好：一是成本账——外围器件从七八颗减到一两颗，加上贴片工序减少，单机BOM成本降10%-15%，按年出货500万台算，一年省的成本是千万级；二是时间账——方案固件直接复用，开发周期从3个月压到4-6周，新品提前一个季度上市；三是风险账——深圳本地供应加日产能100万颗，缺货潮来了不断供，不用像用原厂那样排队等晶圆。",
        "type": "B",
        "correct": true
      },
      {
        "text": "宇凡微YF系列单片机支持合封定制，方案团队80余人，日产能100万颗。",
        "type": "F",
        "correct": false
      },
      {
        "text": "相比原厂标准MCU，我们合封减外围、方案全包、供应灵活。",
        "type": "A",
        "correct": false
      },
      {
        "text": "宇凡微服务过美的、小米、九阳等800多个品牌，42项发明专利。",
        "type": "E",
        "correct": false
      }
    ],
    "explain": "<strong>✅ B - 利益</strong><br><br>利益是「客户得到什么」——成本账（千万级）、时间账（提前一季度）、风险账（不断供）。采购总监的KPI是降本和保供，研发经理的KPI是上市速度，B要同时覆盖两个人的考核指标，并落到可量化的数字上。<br><br>F讲规格、A讲对比、E讲案例。"
  },
  {
    "scenario": "采购总监说：听下来不错，但我们换主控供应商要走公司评审，需要资质和客户案例证明。你们有什么拿得出手的？",
    "question": "下面哪一句是 <strong>E - 证明</strong>（用案例/数据/资质证明）？",
    "options": [
      {
        "text": "宇凡微是国家级高新技术企业和专精特新企业，2017年成立至今服务美的、小米、九阳、木林森等800多个品牌客户；持有42项发明专利、6项集成电路布图设计、17项软件著作权；80余人的工程师研发团队；与台湾九齐、上海普冉等原厂战略合作，晶圆供应有保障；自有封装测试产线日产能100万颗——从华强北小门面起步，七年做到年营收超1.5亿，这个增长本身就是交付能力的证明。",
        "type": "E",
        "correct": true
      },
      {
        "text": "宇凡微YF系列单片机支持合封定制，方案团队80余人，日产能100万颗。",
        "type": "F",
        "correct": false
      },
      {
        "text": "相比原厂标准MCU，我们合封减外围、方案全包、供应灵活。",
        "type": "A",
        "correct": false
      },
      {
        "text": "用了我们的方案，BOM成本降10%-15%，开发周期压缩一半，缺货期不断供。",
        "type": "B",
        "correct": false
      }
    ],
    "explain": "<strong>✅ E - 证明</strong><br><br>证明是用事实背书——800多个品牌客户、42项发明专利、专精特新认证、原厂战略合作、七年从门面到1.5亿。供应商评审最认「大品牌客户背书+资质认证+真实增长曲线」，E就是给采购总监过评审会的「弹药」。<br><br>F/A/B分别是规格、优势、利益。"
  },
  {
    "scenario": "你向某LED照明企业（年出货2000万套灯具）的研发总监介绍宇凡微的智能调光驱动方案。该公司正在做新一代智能灯具，要过新国标和CE认证。",
    "question": "下面四句话，哪一句是 <strong>F - 特征</strong>（方案本身的属性/功能）？",
    "options": [
      {
        "text": "宇凡微智能照明方案包含：照明专用MCU（内置恒流控制与调光算法库，支持可控硅、0-10V、PWM多协议调光）、工作温度-40℃~105℃宽温设计、内置过压过流过温保护固件库、支持蓝牙/红外等接口扩展；方案侧提供原理图、参考设计、认证技术文档和量产烧录测试全流程支持。",
        "type": "F",
        "correct": true
      },
      {
        "text": "相比用普通MCU自己写调光算法，宇凡微的算法库是量产验证过的成熟代码，认证测试一次通过率高；宽温设计直接覆盖驱动电源的高温环境。",
        "type": "A",
        "correct": false
      },
      {
        "text": "用宇凡微方案，认证周期缩短、光效一致性提升、调光客诉减少，产品能按计划赶上出口旺季。",
        "type": "B",
        "correct": false
      },
      {
        "text": "宇凡微是木林森等照明上市企业的方案供应商，服务800多个品牌，42项发明专利。",
        "type": "E",
        "correct": false
      }
    ],
    "explain": "<strong>✅ F - 特征</strong><br><br>特征是客观描述方案的构成——专用MCU、调光协议、宽温范围、保护固件库、接口扩展、全流程支持。照明研发总监关心「认证能不能过+高温环境稳不稳」，F把这些规格讲清楚。<br><br>A是相对自研方案的优势；B是给研发的利益；E是案例背书。"
  },
  {
    "scenario": "研发总监说：我们现在用普通MCU加自己写的调光程序，认证测了两轮才过，调光曲线还会闪。你们比这个强在哪？",
    "question": "下面哪一句是 <strong>A - 优势</strong>（与现有方案相比的优势）？",
    "options": [
      {
        "text": "相比自己写调光程序，宇凡微有三个核心优势：一是算法成熟——调光算法库经过千万级出货量验证，无频闪曲线直接调用，自研代码要反复试错；二是认证友好——方案自带新国标和CE的认证技术文档，测试一次通过率高，自研方案认证资料要自己摸索着补；三是宽温可靠——-40℃~105℃专为驱动电源高温环境设计，普通MCU在灯体里长时间高温运行容易出问题。",
        "type": "A",
        "correct": true
      },
      {
        "text": "宇凡微智能照明方案包含照明专用MCU、多协议调光、宽温设计和保护固件库。",
        "type": "F",
        "correct": false
      },
      {
        "text": "用宇凡微方案，认证周期缩短、无频闪、客诉减少，产品赶上出口旺季。",
        "type": "B",
        "correct": false
      },
      {
        "text": "宇凡微是木林森等照明企业的方案供应商，42项发明专利，日产能100万颗。",
        "type": "E",
        "correct": false
      }
    ],
    "explain": "<strong>✅ A - 优势</strong><br><br>优势是「比自己写程序强在哪」——算法经过千万级验证、认证文档现成、宽温专为灯内环境设计。这三点精准针对「认证两轮才过+调光闪+高温不稳」三个痛点。照明研发总监最怕认证反复，A要打在「一次通过」上。<br><br>F讲方案、B讲好处、E讲案例。"
  },

  var q = questions[currentQ];
  document.getElementById('progressText').textContent = '第 ' + (currentQ+1) + ' / ' + questions.length + ' 题';
  document.getElementById('progressFill').style.width = ((currentQ+1)/questions.length*100) + '%';

  var typeName = {'F':'F 特征','A':'A 优势','B':'B 利益','E':'E 证明'}[q.options.find(function(o){return o.type;}).type] || 'FABE 训练';

  var card = document.getElementById('questionCard');
  card.innerHTML = '<div class="question-badge">' + typeName + ' 训练</div>' +
    '<div class="scenario"><span class="label">📋 场景：</span><br>' + q.scenario + '</div>' +
    '<div style="font-size:16px;font-weight:600;color:#333;margin-bottom:16px;">' + q.question + '</div>' +
    '<div class="options">' +
    q.options.map(function(opt,i){
      return '<div class="option" onclick="selectOpt(' + i + ')">' +
        '<div class="radio"></div>' +
        '<div class="text">' + opt.text + '</div>' +
      '</div>';
    }).join('') +
    '</div>' +
    '<div class="explanation" id="explanation">' +
      '<h4>✅ 解析</h4>' +
      '<p>' + q.explain + '</p>' +
    '</div>';

  answered = false;
  document.getElementById('btnNext').textContent = '确认答案';
  document.getElementById('btnNext').disabled = true;
  document.getElementById('resultPage').classList.remove('show');
  document.getElementById('quizPage').style.display = '';
}

window.selectOpt = function(idx) {
  if (answered) return;
  var opts = document.querySelectorAll('.option');
  opts.forEach(function(opt,i){ opt.classList.toggle('selected', i===idx); });
  window.selectedIdx = idx;
  document.getElementById('btnNext').disabled = false;
};

window.nextQ = function() {
  if (window.selectedIdx === undefined) return;
  if (!answered) {
    answered = true;
    var q = questions[currentQ];
    var opts = document.querySelectorAll('.option');
    opts.forEach(function(opt,i){
      if (q.options[i].correct) opt.classList.add('correct');
      if (i === window.selectedIdx && !q.options[i].correct) opt.classList.add('wrong');
    });
    answers[currentQ] = q.options[window.selectedIdx].correct;
    document.getElementById('explanation').classList.add('show');
    document.getElementById('btnNext').textContent = currentQ < questions.length-1 ? '下一题 →' : '查看结果';
  } else {
    if (currentQ < questions.length-1) {
      currentQ++;
      window.selectedIdx = undefined;
      renderQ();
    } else {
      showResult();
    }
  }
};

window.prevQ = function() {
  if (currentQ > 0) {
    currentQ--;
    window.selectedIdx = undefined;
    renderQ();
    if (answers[currentQ] !== undefined) {
      answered = true;
      var q = questions[currentQ];
      var opts = document.querySelectorAll('.option');
      opts.forEach(function(opt,i){
        if (q.options[i].correct) opt.classList.add('correct');
        if (answers[currentQ] === false && i === window.selectedIdx) opt.classList.add('wrong');
      });
      document.getElementById('explanation').classList.add('show');
      document.getElementById('btnNext').textContent = currentQ < questions.length-1 ? '下一题 →' : '查看结果';
    }
  }
};

function showResult() {
  document.getElementById('quizPage').style.display = 'none';
  var score = answers.filter(function(a){return a;}).length;
  var percent = Math.round(score / questions.length * 100);
  document.getElementById('scoreNum').textContent = score;
  document.getElementById('percentNum').textContent = percent;

  var detail = '<h3>📊 答题详情</h3>';
  questions.forEach(function(q,i){
    var icon = answers[i] ? '✅' : '❌';
    var title = q.scenario.substring(0, 40) + '...';
    detail += '<div class="result-item"><span style="font-size:18px;">' + icon + '</span><span>第' + (i+1) + '题：' + title + '</span></div>';
  });
  document.getElementById('resultDetail').innerHTML = detail;
  document.getElementById('resultPage').classList.add('show');
}

window.restart = function() {
  currentQ = 0;
  answers = [];
  window.selectedIdx = undefined;
  answered = false;
  renderQ();
};

renderQ();
</script>
</body>
</html>
