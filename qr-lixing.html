<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>利兴纺织 · 练习工具二维码</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #B85042 0%, #2F3C7E 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        .header .icon { font-size: 60px; margin-bottom: 10px; }
        .header h1 { font-size: 28px; margin-bottom: 8px; }
        .header p { font-size: 14px; opacity: 0.9; }
        
        .tools-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        @media (max-width: 600px) {
            .tools-grid { grid-template-columns: 1fr; }
        }
        
        .tool-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            transition: transform 0.3s;
        }
        .tool-card:hover { transform: translateY(-5px); }
        
        .tool-icon { font-size: 50px; margin-bottom: 15px; }
        .tool-title {
            color: #2F3C7E;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .tool-desc {
            color: #666;
            font-size: 13px;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        
        .qr-wrapper {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 15px;
            display: inline-block;
            margin-bottom: 15px;
            border: 2px dashed #B85042;
        }
        .qr-wrapper img {
            width: 200px;
            height: 200px;
            display: block;
        }
        
        .tool-url {
            background: #f0f0f0;
            padding: 10px 15px;

            border-radius: 8px;
            font-size: 11px;
            color: #666;
            word-break: break-all;
            font-family: monospace;
            margin-top: 15px;
        }
        
        .footer {
            text-align: center;
            color: white;
            margin-top: 20px;
        }
        .footer p {
            font-size: 14px;
            margin-bottom: 10px;
            opacity: 0.9;
        }
        .print-btn {
            background: #F9E795;
            color: #2F3C7E;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .print-btn:hover { background: #f0d975; transform: scale(1.05); }
        
        @media print {
            body { background: white; padding: 0; }
            .header { color: #2F3C7E; }
            .footer { display: none; }
            .tool-card { box-shadow: none; border: 1px solid #ddd; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="icon">🎯</div>
            <h1>利兴纺织 · 练习工具</h1>
            <p>销售实战训练 · 扫码即练</p>
        </div>
        
        <div class="tools-grid">
            <!-- SPIN工具 -->
            <div class="tool-card">
                <div class="tool-icon">🔍</div>
                <div class="tool-title">SPIN 挖痛练习</div>
                <div class="tool-desc">利兴定制版 · 8个真实场景<br>提升提问能力 · 挖掘客户痛点</div>
                
                <div class="qr-wrapper">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://dongdajack-lab.github.io/customer-grading/spin-lixing.html" alt="SPIN练习二维码" />
                </div>
                
                <div class="tool-url">https://dongdajack-lab.github.io/customer-grading/spin-lixing.html</div>
            </div>
            
            <!-- FABE工具 -->
            <div class="tool-card">
                <div class="tool-icon">💎</div>
                <div class="tool-title">FABE 产品介绍</div>
                <div class="tool-desc">利兴定制版 · 8个实战题目<br>特征→优势→利益→证明</div>
                
                <div class="qr-wrapper">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://dongdajack-lab.github.io/customer-grading/fabe-lixing.html" alt="FABE练习二维码" />
                </div>
                
                <div class="tool-url">https://dongdajack-lab.github.io/customer-grading/fabe-lixing.html</div>
            </div>
        </div>
        
        <div class="footer">
            <p>📱 手机扫码即可开始练习</p>
            <button class="print-btn" onclick="window.print()">🖨️ 打印二维码</button>
        </div>
    </div>
</body>
</html>
