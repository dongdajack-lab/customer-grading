<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">
<title>米思米 分支演练 · 三关九角色</title>
<style>
:root{
  --navy:#1B2A4A; --steel:#2E6B9E; --orange:#E67E22;
  --ink:#1F2430; --sub:#5F6673; --line:#E3E6EC; --bg:#F5F7FA;
  --ok:#1D9E75; --okbg:#E1F5EE; --bad:#C0392B; --badbg:#FCEBEB;
  --tip:#185FA5; --tipbg:#E6F1FB; --gold:#D98A1D;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 40px}
header{background:linear-gradient(0deg,#1B2A4A,#1B2A4A);color:#fff;padding:16px 0;margin-bottom:14px}
header .wrap{padding-bottom:0}
h1{margin:0;font-size:19px;font-weight:600;letter-spacing:.3px}
.sub{font-size:12.5px;opacity:.72;margin-top:4px}
.ver{display:inline-block;background:rgba(255,255,255,.15);border-radius:4px;padding:1px 7px;font-size:11.5px;margin-left:8px;vertical-align:2px}
.grid{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ch{background:#F8F9FB;border-bottom:1px solid var(--line);padding:10px 14px;font-size:13.5px;font-weight:600;color:var(--navy);
  display:flex;justify-content:space-between;align-items:center;gap:8px}
.ch .step{font-size:12px;font-weight:400;color:var(--sub);white-space:nowrap}
.body{padding:14px}
/* 关卡地图 */
.map{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.gate{border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px 10px;flex:1;min-width:230px}
.gate.locked{opacity:.5;background:#FAFBFC}
.gate .gt{font-size:12px;font-weight:600;color:var(--navy);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.gate .gt .lock{font-size:11px;color:var(--sub);font-weight:400}
.gate.done .gt .st{color:var(--ok)}
.gate .st{font-size:11px;color:var(--sub);font-weight:400}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;font-size:12.5px;cursor:pointer;font-family:inherit;color:var(--ink);display:flex;align-items:center;gap:5px}
.chip:hover:not(.locked):not(.on){border-color:var(--steel);color:var(--steel)}
.chip.on{border-color:var(--orange);background:#FFF6EC;color:#8A4A0B;font-weight:600}
.chip.passed{border-color:#B7E0D0;background:#F2FBF7;color:#0B5C44}
.chip .mk{font-size:11px}
.rule{background:#FFF8F0;border-left:3px solid var(--orange);padding:9px 12px;border-radius:0 8px 8px 0;font-size:12.5px;color:#7A4310;margin-bottom:14px}
.rule b{color:#8A3B0B}
.thread{padding:14px;display:flex;flex-direction:column;gap:12px}
.bubble{max-width:88%;padding:11px 13px;border-radius:12px;font-size:13.5px;line-height:1.7}
.bubble.cu{align-self:flex-start;background:#F1F3F7;border:1px solid var(--line);border-top-left-radius:3px}
.bubble.me{align-self:flex-end;background:var(--steel);color:#fff;border-top-right-radius:3px}
.bubble .who{font-size:11.5px;opacity:.65;margin-bottom:3px;display:block}
.note{padding:10px 12px;border-radius:9px;font-size:12.5px;line-height:1.7}
.note.bad{background:var(--badbg);color:#8C2B20}
.note.tip{background:var(--tipbg);color:#0F447C}
.note b{font-weight:600}
.asklabel{font-size:12.5px;color:var(--sub);margin:2px 0 -4px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:9px;
  padding:11px 13px;font-size:13.5px;line-height:1.65;color:var(--ink);cursor:pointer;font-family:inherit;
  display:flex;gap:9px;align-items:flex-start;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--steel);background:#FAFCFF}
.opt:disabled{cursor:default}
.opt .k{flex:0 0 20px;height:20px;border-radius:5px;background:#EEF1F6;color:var(--sub);font-size:12px;
  display:flex;align-items:center;justify-content:center;font-weight:600;margin-top:1px}
.opt.done{border-color:#F0C9C4;background:#FEF7F6}
.opt.done .k{background:#F7D2CD;color:#9B3730}
.opt.done .t{color:#96706C;text-decoration:line-through;text-decoration-color:#E0B6B1}
.opt.picked{border-color:var(--ok);background:var(--okbg)}
.opt.picked .k{background:var(--ok);color:#fff}
.tag{font-size:11.5px;padding:1px 6px;border-radius:4px;margin-left:6px;white-space:nowrap}
.tag.b{background:var(--badbg);color:var(--bad)}
.tag.n{background:#EEF1F6;color:var(--sub)}
.side{display:flex;flex-direction:column;gap:14px}
.kv{font-size:12.5px;color:var(--sub);margin-bottom:6px}
.kv b{display:block;color:var(--navy);font-size:12.5px;margin-bottom:2px}
ul.pains{margin:0;padding-left:18px;font-size:13px;line-height:1.85;color:#3A4150}
.acts{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 14px}
button.b{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:13px;
  color:var(--ink);cursor:pointer;font-family:inherit}
button.b:hover{border-color:var(--steel);color:var(--steel)}
button.b.pri{background:var(--navy);border-color:var(--navy);color:#fff}
button.b.pri:hover{background:#24365C;color:#fff}
button.b.gold{background:linear-gradient(135deg,#D98A1D,#B96E0A);border-color:#B96E0A;color:#fff;font-weight:600}
button.b.gold:hover{filter:brightness(1.08);color:#fff}
.pass{background:linear-gradient(0deg,#E8F5F0,#E8F5F0);border:1px solid #B7E0D0}
.pass .body{background:#fff}
textarea{width:100%;min-height:190px;border:1px solid var(--line);border-radius:9px;padding:11px 12px;
  font-size:13px;line-height:1.75;font-family:inherit;color:var(--ink);resize:vertical;background:#FCFDFE}
.hint{font-size:12px;color:var(--sub);margin-top:7px}
.rec{font-size:12.5px;color:var(--sub);line-height:1.9}
.rec div{padding:4px 0;border-bottom:1px dashed var(--line)}
.rec div:last-child{border:0}
/* 通关横幅 */
.passhero{position:relative;overflow:hidden;border-radius:12px;text-align:center;
  background:linear-gradient(135deg,#FFF6E3 0%,#FDEBC8 55%,#FBE0B0 100%);
  border:1px solid #F0CE8A;padding:22px 16px 20px;margin:2px 0 4px}
.passhero .confetti{position:absolute;border-radius:2px;opacity:.85;animation:fall 2.6s ease-in forwards}
@keyframes fall{0%{transform:translateY(-14px) rotate(0);opacity:0}18%{opacity:.9}100%{transform:translateY(34px) rotate(220deg);opacity:0}}
.passhero .trophy{width:56px;height:56px;margin:0 auto 6px;display:block;
  filter:drop-shadow(0 3px 5px rgba(176,124,20,.28));animation:pop .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.passhero .bdg{display:inline-block;color:#fff;font-size:21px;font-weight:700;letter-spacing:8px;padding:5px 20px 5px 26px;border-radius:999px;
  box-shadow:0 3px 8px rgba(176,110,10,.32);
  background-image:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.4) 48%,transparent 62%),linear-gradient(135deg,#D98A1D,#B96E0A);
  background-size:220px 100%,100% 100%;background-repeat:no-repeat;animation:shine 2.2s ease 1 .6s}
@keyframes shine{0%{background-position:-180px 0}100%{background-position:220px 0}}
.passhero .dsc{font-size:13px;color:#7A5410;margin-top:10px;line-height:1.75}
.passhero .dsc b{color:#5C3D05}
.allpasshero{background:linear-gradient(135deg,#E7F0FA 0%,#D7E6F5 100%);border-color:#B9CFE6}
.allpasshero .bdg{background-image:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.45) 48%,transparent 62%),linear-gradient(135deg,#2E6B9E,#1B2A4A);
  box-shadow:0 3px 8px rgba(27,42,74,.3)}
.allpasshero .dsc{color:#1F3A5C}
.allpasshero .dsc b{color:#12294A}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>米思米 分支演练 · 三关九角色<span class="ver">v2.0</span></h1>
    <div class="sub">每步四选一 · 选错当场告诉你为什么 · 过完一关内三张卡解锁下一关</div>
  </div>
</header>

<div class="wrap">
  <div class="card" style="margin-bottom:14px">
    <div class="ch">关卡地图<span class="step" id="progTxt"></span></div>
    <div class="body"><div class="map" id="map"></div></div>
  </div>

  <div class="grid">
    <div>
      <div class="card">
        <div class="ch"><span id="cardTitle">演练台</span><span class="step" id="stepTxt"></span></div>
        <div class="rule" id="ruleBar"></div>
        <div class="thread" id="thread"></div>
        <div class="body" id="stage" style="padding-top:0"></div>
      </div>
    </div>

    <div class="side">
      <div class="card">
        <div class="ch">这一关</div>
        <div class="body" id="metaBox"></div>
      </div>
      <div class="card">
        <div class="ch">这类客户通常痛这些</div>
        <div class="body">
          <ul class="pains" id="painBox"></ul>
          <div class="hint" id="painHint"></div>
        </div>
      </div>
      <div class="card">
        <div class="ch">走过的路</div>
        <div class="body"><div class="rec" id="rec"><div style="color:#9AA1AE">还没开始</div></div></div>
      </div>
    </div>
  </div>
</div>

<script>
/* ================= 关卡与角色元数据 ================= */
const GATES = [
  ['lin','log','chen'],
  ['li','zhang','qc'],
  ['wang','liu','fin']
];
const GATE_NAME = ['第一关 · 怎么开口','第二关 · 怎么深入','第三关 · 怎么收口'];

const META = {
lin:{ name:'小林', role:'采购 · 刚接手离职同事的摊子不到一个月', chan:'电话',
  practice:'SPIN·S 现状提问 + 全渠道推进（电话 → 企微）',
  goal:'加上他的企微，并且拿到真正选型人的称呼或分机',
  rule:'他是接手的新人，没带型号来，也不懂型号——你甩一串型号参数，他只会「我记录一下，问一下工程师」，然后冷场。先给一样他看得懂、能转交的东西，才换得到话；直接打听谁是负责人、你们量多少，他会警觉不答。<b>名字靠「换」，不靠「问」。</b>这是<b>电话</b>：他在电话里说「发」，就必须落到企微或邮件——把对话从电话搬到企微，正是这一关要练的推进。',
  pains:['下单便利性（包括特殊要求的对应）','对接服务的响应度及服务态度'],
  painHint:'上期课堂共创原文。他刚接手，最怕的是「问谁都不知道、东西发过去没人认」。'},
log:{ name:'郑师傅', role:'收货 / 仓库 · 只管今天能不能用上', chan:'电话',
  practice:'异常响应顺序：先止血（今天能用上），再防再发（单据与捆包）',
  goal:'给出当天可执行的处理（补发／自提，几点到），并约定下次发货前先确认单据和捆包要求',
  rule:'他要的是今天这批货怎么用上，不是谁的责任。说「我反馈一下」「这是物流的问题」，他当场翻脸；只道歉不给动作，他追问「货呢」。先给当天能落地的处理（几点到、怎么补），再说清错的那批怎么退、说明函什么时候出。',
  pains:['缺货','单据不全','实物与标签型号不符','特殊捆包要求未满足','送错地址','混料','紧急件对应'],
  painHint:'上期课堂共创原文。收货的人不管谁对谁错，只管产线停不停。'},
chen:{ name:'陈总', role:'小老板 · 只认「多久到、多少钱」', chan:'电话 / 企微',
  practice:'FABE 的顺序：把利益（多久到、多少钱）压到一句话里，别铺陈特征',
  goal:'让他向你要一份现货型号清单，或当场下一个小单',
  rule:'他只认「多久到、多少钱」。讲公司规模、品牌故事，他说「行了行了，说现货」；说「我帮您向领导申请折扣」，他说「那你申请完再打给我」——人情筹码完全无效。他问「怎么付款、送到哪个门」就是成交信号，这时你还在讲产品即失败。',
  pains:['成本压力大：降本落地难','现金流风险：账期长、回款困难','产品品质不稳定，品控难落地','内外沟通效率低，响应迟缓'],
  painHint:'上期课堂共创原文。小老板的经营层痛点再多，急单这一刻他只关心现货和价格。'},
li:{ name:'李工', role:'设计 / 选型工程师 · 带着型号来', chan:'电话',
  practice:'用可验证的具体信息（四个数）换提问资格，再挖选型痛点',
  goal:'加上企业微信，并让他说出「经济品／替代型号你也可以给我建议一下」',
  rule:'他带着型号来，等的是四个数——库存、单价、交期（具体到日）、同规格经济品便宜多少。这四个数没给就先问「您选型上有什么困难」，他回你「没困难，报价给我」；说套话、报抽象数，他直接挂断。',
  pains:['选型','品质','价格','交付（交期）','装配与现场调试'],
  painHint:'上期课堂共创原文。他问「经济品寿命一样吗」，就是在给你挖痛点的入口。'},
zhang:{ name:'张经理', role:'采购经理 · 新供应商准入，手里有比价权', chan:'邮件 → 电话',
  practice:'LSCPA 的 C（澄清）：把「贵」拆成单价／综合成本，再谈价',
  goal:'同意做一次按综合口径的对比报价（含交期、异常处理、赔付），或约成 15 分钟电话',
  rule:'他比的是口径，不是单价。谈战略合作、资源整合，他只回一句「把资质和报价发我邮箱」；一被压价就降价，他会继续压，永不成交。先澄清他的「贵」是单价贵还是综合成本高，再谈。',
  pains:['价格（低价格／价格稳定）','交期（短交期／交期守时）','售后服务便利性和及时性','公司资质','账期&额度','对账便利性&准确度'],
  painHint:'上期课堂共创原文。他嘴上说贵，账上算的是停线风险和返工成本。'},
qc:{ name:'何工', role:'品管 · 这批货压在他手里待判', chan:'电话 / 邮件',
  practice:'FABE 的 E（证据）+ 把「追责」转成「共同标准」',
  goal:'达成「先按贵司口径自测 + 三件样件带尺寸报告，验证通过再走批量」的判定路径',
  rule:'他要的是能拿去判定的依据，不是保证。说「质量没问题」「很多客户在用」，他立刻要第三方检测报告；先对齐检测标准和判定口径（哪份图纸、什么量具、怎么抽样），再给证据，最后给一条风险可控的路径。',
  pains:['品质合格率','检测标准／工具','检测报告','超质保期','补货（速度／不良等）'],
  painHint:'上期课堂共创原文。品管不跟你吵质量好不好，他只认「拿什么判」。'},
wang:{ name:'王工', role:'VE 工程师 · 在评估国产替代', chan:'邮件 / 企微',
  practice:'FABE 的 E（证据）：优势挂书面依据，再配风险控制路径',
  goal:'达成样件 + 尺寸报告的共识，哪怕只是一句「那我先申请走流程」',
  rule:'他要的是证据，不是保证。说「我们质量也不错、很多客户在用」，他回一句「有第三方检测吗」，当场冷下来；泛泛谈价格，礼貌结束。优势必须挂一份可打印的书面依据，再配一条万一验证不过怎么收场的路径。',
  pains:['品质','装配与现场调试','交付（交期）'],
  painHint:'上期课堂共创原文。他真正怕的是替代件上产线出了问题没法交代。'},
liu:{ name:'刘工', role:'老客户设备主管 · 被上次那批伤过', chan:'企微',
  practice:'主动认领旧账：沉默型客户不会投诉，只会慢慢消失',
  goal:'让他把真实不满说出来，并同意挑一两个型号重做对比或寄样件',
  rule:'他被伤过，你得先认领旧账。上来推新品、降本、活动，他回「不用了谢谢」；拍胸脯说「以后绝对不会再这样」，他明显不信。先把那笔旧账说破，再给一个不涉及降价的具体动作。',
  pains:['品质合格率','超质保期','补货（速度／不良等）'],
  painHint:'上期课堂共创原文。你不先提那笔账，他永远不会说——他只会慢慢不下单。'},
fin:{ name:'孙会计', role:'财务 · 只管这个数能不能入账', chan:'邮件 → 电话',
  practice:'把模糊约定变成可执行口径：对账口径、开票字段、时间点定死',
  goal:'约定统一的对账口径，并定下开票信息的事前确认方式',
  rule:'她要的是口径一致、能入账，不是优惠。谈折扣、催款，她回一句「找采购」；说「差不多」「应该没问题」，她追问「差不多是多少」。先把对账口径和开票字段定死（品名／型号／包装数量／税号），省的是她每月的返工。',
  pains:['对账单：口径不统一','开票要求（品名／型号／包装数量）','高效对账方式：仍靠微信／Excel','送货单：信息不全、与订单不一致'],
  painHint:'上期课堂共创原文。财务不谈生意，只谈「这个数能不能入账、两边对不对得上」。'}
};

/* ================= 决策树：cue=客户说，opts=四个选择，to=走到哪，v=good/bad/neutral ================= */
const TREE = {
/* ---------- 第一关 ---------- */
lin:{
  t1:{ step:1, cue:'您好，请问是米思米吗？我是新来的小林，之前对接的同事走得很急，这边我还没完全接上手……',
    opts:[
      {t:'我先加您企微，把你们常用件的一页纸发过去，看着找型号就行。', to:'t2', v:'good'},
      {t:'小林您好，我先介绍下米思米的产品线和优势，听完您就知道我们能做什么。', v:'bad',
       cue:'嗯……产品线的事我刚接手，还不太清楚。',
       coach:'他接的是别人留下的烂摊子，要的是有人替他减负担，不是听供应商讲优势。先给他一样看得懂、能转交的东西，才换得到话。'},
      {t:'方便加一下您微信吗？以后报价和货期的事，我在微信上随时跟您说。', v:'bad',
       cue:'呃……加微信啊。我们还不太熟，您先……算了，我先看看您发什么吧。',
       coach:'你还没给过他任何东西就要联系方式，他警觉了。先给一样他看得懂、能转交的，再顺着这份东西要人——名字靠「换」，不靠「问」。'},
      {t:'请问现在负责选型的是哪位工程师？我直接找他确认规格，免得来回传话。', v:'bad',

/* ================= 状态 ================= */
let card='lin', cur='t1';   // card=卡片id（META/TREE 顶层键），cur=该卡内的节点键（t1/t2/tP）
let log=[], done={}, passed=false;
let ORDER={};           // 展示位 → 原始下标（进入某关洗一次，本轮固定）
let prog={};            // {cardId:true} 持久化
try{ prog = JSON.parse(localStorage.getItem('msbr-prog') || '{}'); }catch(e){ prog = {}; }
let lastCard='';

function saveProg(){ try{ localStorage.setItem('msbr-prog', JSON.stringify(prog)); }catch(e){} }
function gatePassed(gi){ return GATES[gi].every(id=>prog[id]); }
function gateUnlocked(gi){ return gi===0 || gatePassed(gi-1); }
function gateProgress(gi){ return GATES[gi].filter(id=>prog[id]).length + '/' + GATES[gi].length; }

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* 洗牌：返回展示顺序（原始下标数组）。同一关只洗一次，重进不变 */
function orderOf(node, key){
  if(ORDER[key]) return ORDER[key];
  const idx = node.opts.map((_, i) => i);
  for(let i = idx.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = idx[i]; idx[i] = idx[j]; idx[j] = t;
  }
  ORDER[key] = idx;
  return idx;
}

function renderMap(){
  const m=$('map'); m.innerHTML='';
  GATES.forEach((ids,gi)=>{
    const g=document.createElement('div');
    g.className='gate'+(gateUnlocked(gi)?'':' locked');
    if(gatePassed(gi)) g.classList.add('done');
    const unlocked=gateUnlocked(gi);
    g.innerHTML='<div class="gt"><span>'+GATE_NAME[gi]+'</span><span class="'+(gatePassed(gi)?'st':'lock')+'">'+
      (gatePassed(gi)?'✔ 全部通关 '+gateProgress(gi) : unlocked? gateProgress(gi)+' 已通关' : '🔒 过完上一关解锁')+'</span></div>';
    const chips=document.createElement('div'); chips.className='chips';
    ids.forEach(id=>{
      const c=document.createElement('button');
      c.className='chip'+(id===card?' on':'')+(prog[id]?' passed':'');
      if(!unlocked) c.classList.add('locked');
      c.innerHTML=(prog[id]?'<span class="mk">✔</span>':'<span class="mk">'+(unlocked?'':'🔒')+'</span>')+META[id].name;
      c.disabled=!unlocked;
      c.onclick=()=>pickCard(id);
      chips.appendChild(c);
    });
    g.appendChild(chips);
    m.appendChild(g);
  });
  const total=Object.keys(META).length, passedN=Object.keys(prog).length;
  $('progTxt').textContent='已通关 '+passedN+' / '+total;
}

function renderMeta(){
  const m=META[card];
  $('cardTitle').textContent='演练台 · '+m.name;
  $('ruleBar').innerHTML='<b>'+m.name+'这一关：</b>'+m.rule;
  $('metaBox').innerHTML=
    '<div class="kv"><b>角色</b>'+m.role+'</div>'+
    '<div class="kv"><b>渠道</b>'+m.chan+'</div>'+
    '<div class="kv"><b>要练的</b>'+m.practice+'</div>'+
    '<div class="kv" style="margin-bottom:0"><b>通关标准</b>'+m.goal+'</div>';
  $('painBox').innerHTML=m.pains.map(p=>'<li>'+esc(p)+'</li>').join('');
  $('painHint').textContent=m.painHint;
}

function render(){
  const node=TREE[card][cur];
  $('stepTxt').textContent = node.pass ? '已通关' : ('第 '+node.step+' 步 / 共 2 步');
  $('thread').innerHTML='';
  log.forEach(e=>{
    if(e.type==='cue') bubble('cu', e.text, e.sys);
    else if(e.type==='me') bubble('me', e.text);
    else note(e.kind, e.text);
  });
  if(node.cue && !log.some(e=>e.type==='cue'&&e.text===node.cue)) bubble('cu', node.cue, node.sys);

  $('stage').innerHTML='';
  if(node.pass){ passed=true; showPass(node); renderMap(); renderMeta(); return; }

  const lab=document.createElement('div');
  lab.className='asklabel';
  lab.textContent = log.some(e=>e.kind==='bad') && log.length>2 ? '换一个说法再试：' : '你该怎么接？';
  $('stage').appendChild(lab);

  const box=document.createElement('div');
  box.className='opts';
  box.style.marginTop='8px';
  const keys=['A','B','C','D'];
  const order = node.opts ? orderOf(node, card+'-'+node.step) : [];
  order.forEach((i,pos)=>{
    const o = node.opts[i];
    const b=document.createElement('button');
    b.className='opt';
    const used = done[card+'-'+node.step+'-'+i];
    if(used==='bad') b.classList.add('done');
    if(used==='good') b.classList.add('picked');
    const tag = (o.v==='good') ? ''
      : (used==='bad') ? '<span class="tag b">已试过·踩</span>'
      : (used==='neutral') ? '<span class="tag n">已试过·停住</span>' : '';
    b.innerHTML = '<span class="k">'+keys[pos]+'</span><span class="t">'+esc(o.t)+tag+'</span>';
    b.disabled = !!used;
    b.onclick = ()=>pick(o,i);
    box.appendChild(b);
  });
  $('stage').appendChild(box);

  if(node.opts.every((o,i)=>done[card+'-'+node.step+'-'+i])){
    const d=document.createElement('div');
    d.className='note tip';
    d.style.marginTop='10px';
    d.innerHTML='<b>四种都不对。</b>回头看看顶部那条铁律——这一关的关键都写在里面了，再来一遍。';
    $('stage').appendChild(d);
  }
  recRender();
}

function bubble(who, text, sys){
  const d=document.createElement('div');
  d.className='bubble '+(who==='me'?'me':'cu');
  d.innerHTML = (who==='me' ? '' : '<span class="who">'+esc(META[card].name)+'</span>') + esc(text) + (sys?'<span class="tag n">'+esc(sys)+'</span>':'');
  $('thread').appendChild(d);
  window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'});
}
function note(kind, html){
  const d=document.createElement('div');
  d.className='note '+kind;
  d.innerHTML=html;
  $('thread').appendChild(d);
}

function pick(o,i){
  const node=TREE[card][cur];
  done[card+'-'+node.step+'-'+i] = o.v;
  log.push({type:'me', text:o.t});

  if(o.v==='good'){
    const nxt = TREE[card][o.to];
    log.push({type:'cue', text:nxt.cue, sys:nxt.sys});
    log.push({type:'note', kind:'ok', text:'<b>打开：</b>'+(o.coach||'他接话了，往下走。')});
    cur = o.to;
    render();
    return;
  }
  log.push({type:'cue', text:o.cue});
  log.push({type:'note', kind:o.v==='bad'?'bad':'tip', text:'<b>'+(o.v==='bad'?'踩了：':'停住了：')+'</b>'+o.coach});
  render();
}

/* 通关后：下一张没过的卡（同关优先，其次下一关），全部通关返回 null */
function nextCard(){
  const gi = GATES.findIndex(g=>g.includes(card));
  for(const id of GATES[gi]) if(!prog[id] && id!==card) return id;
  for(let g=gi+1; g<GATES.length; g++){
    if(gateUnlocked(g)) for(const id of GATES[g]) if(!prog[id]) return id;
  }
  return null;
}

    '一、澄清「贵」（LSCPA 的 C，先不动价）','您说的贵，是比单价，还是比算上到货及时率的综合成本？我们现货率92%、延期赔付写进条款——两个口径我各做一版给您比。','',
    '二、约15分钟电话收口','三列对比：单价、到货及时率、异常处理时效和赔付。约15分钟电话，我把两版口径过一遍，您定用哪版比？','',
    '三、铁律','· 一被压价就降价，他会一直压，永不成交。','· 口径立起来之后，不让步——降价的时机在对比之后。'].join('\n'),
  qc:['【米思米 · 话术卡】','场景：来料检验判待决（电话/邮件）','对象：品管，只认「拿什么判」','通关：约定按他口径自测 + 三件样件带尺寸报告','',
    '一、先对齐判定口径','这批按哪份图纸判、用什么量具、抽几个？我先照您的口径自测。','',
    '二、证据+路径','我按您同样的量具和方法测三件样件，尺寸报告差在哪一项标在第几页，验证通过再走批量，判定全按您这边来。','',
    '三、铁律','· 不说「质量稳定」「应该没问题」——他只认检测报告。','· 先共同标准，再上证据；让步接收要他签字，帮他扫清签字的障碍。'].join('\n'),
  wang:['【米思米 · 话术卡】','场景：进口件国产替代（邮件/企微）','对象：VE工程师，只认证据','通关：样件+尺寸报告共识（哪怕只是「我先申请走流程」）','',
    '一、差异挂书面依据','区别有三处，我在第三方报告里标了页码，材质书、公差带今天发您。','',
    '二、证据+风险路径','先按贵司图纸做三件样件不上产线，尺寸报告签字版一起给；万一超差，48小时内原规格现货补上——这份应对方案写进报告发您。','',
    '三、铁律','· 每个优势都要挂可打印的书面依据（报告名、页码、数据）。','· 他问「最坏会怎样」是递台阶——接住：最坏情况+怎么防+出了事怎么补。'].join('\n'),
  liu:['【米思米 · 话术卡】','场景：老客户下单频率下降（企微回访）','对象：被上次那批伤过的设备主管','通关：他说出真实不满 + 同意先看样件','',
    '一、先认领旧账（你不提他永远不说）','刘工，上次那批304的色差，最后是怎么处理的，我一直没跟进，心里不踏实。','',
    '二、承认事实+不降价的具体动作','我不敢说以后绝不会有——您挑一两个最在意的型号，我先寄三件样件，您确认色差过关再下单。','',
    '三、铁律','· 不推新品、不做降价补偿——他缺的不是便宜，是「这批不会再错」的证据。','· 拍胸脯说「绝对不」是他最不信的话。'].join('\n'),
  fin:['【米思米 · 话术卡】','场景：月度对账口径不一致+开票信息不符（邮件转电话）','对象：财务，只管这个数能不能入账','通关：对账口径定死 + 开票信息事前确认','',
    '一、口径定死（选一个，说清差异怎么调）','咱们定死按收货口径，差的那几行我在下月对账单里单列一行给您核对。','',
    '二、开票字段一次问全+给她节奏','品名、型号、包装数量、税号，备注带送货单号和合同编号。以后每月20号我先发对账单，您25号前核完。','',
    '三、铁律','· 不谈折扣不催款——催款是往枪口上撞。','· 「差不多」在她那儿是最大的脏话；模板你出、她只管确认。'].join('\n')
  };
  return C[id];
}

function showPass(node){
  prog[card]=true; saveProg();
  const hero=document.createElement('div');
  hero.className='passhero';
  const cols=['#E67E22','#2E6B9E','#1D9E75','#D98A1D','#C0392B'];
  let dots='';
  for(let i=0;i<16;i++){
    dots+='<i class="confetti" style="left:'+(4+Math.random()*92)+'%;top:'+(8+Math.random()*55)+'%;'+
      'width:'+(5+Math.random()*5)+'px;height:'+(8+Math.random()*7)+'px;background:'+cols[i%cols.length]+';'+
      'animation-delay:'+(Math.random()*0.9).toFixed(2)+'s"></i>';
  }
  hero.innerHTML = dots +
    '<svg class="trophy" viewBox="0 0 64 64" aria-hidden="true">'+
    '<path d="M20 10h24v6c0 9-5 16-12 16s-12-7-12-16v-6z" fill="#E8A93C"/>'+
    '<path d="M20 12h-7c0 8 3 13 9 14M44 12h7c0 8-3 13-9 14" stroke="#C8892A" stroke-width="3" fill="none" stroke-linecap="round"/>'+
    '<path d="M30 32h4v8h-4z" fill="#C8892A"/>'+
    '<path d="M24 42h16v4H24z" fill="#E8A93C"/>'+
    '<path d="M20 46h24v6H20z" fill="#C8892A"/>'+
    '<path d="M26 15l3 3 6-6" stroke="#FFF6E3" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'+
    '</svg>'+
    '<span class="bdg">通 关</span>'+
    '<div class="dsc">'+passHeroText(card)+'</div>';
  $('thread').appendChild(hero);

  const cardTxt=passCardText(card);
  const nxt=nextCard();
  const nxtName = nxt ? META[nxt].name : '';
  const nxtGate = nxt ? (GATE_NAME[GATES.findIndex(g=>g.includes(nxt))]) : '';

  const wrap=document.createElement('div');
  wrap.className='card pass';
  wrap.style.marginTop='4px';
  wrap.innerHTML =
    '<div class="ch" style="background:#E8F5F0;border-bottom-color:#B7E0D0">话术卡 · 可直接带走</div>'+
    '<div class="body">'+
    '<textarea id="ta" readonly>'+esc(cardTxt)+'</textarea>'+
    '<div class="hint">回到岗位上，把卡里的「一页纸／对照表／样件」换成你手上真实在发的那份——客户认的是名字，不是「资料」两个字。</div>'+
    '<div class="acts" style="padding:10px 0 0">'+
    '<button class="b pri" onclick="cp()">复制话术卡</button>'+
    '<button class="b" onclick="restart()">再练一遍</button>'+
    (nxt ? '<button class="b gold" onclick="goNext()">下一关 → '+esc(nxtName)+'（'+esc(nxtGate)+'）</button>' : '')+
    '</div></div>';
  $('stage').appendChild(wrap);

  if(!nxt){
    const all=document.createElement('div');
    all.className='passhero allpasshero';
    let dots2='';
    for(let i=0;i<20;i++){
      dots2+='<i class="confetti" style="left:'+(4+Math.random()*92)+'%;top:'+(8+Math.random()*55)+'%;'+
        'width:'+(5+Math.random()*5)+'px;height:'+(8+Math.random()*7)+'px;background:'+cols[i%cols.length]+';'+
        'animation-delay:'+(Math.random()*0.9).toFixed(2)+'s"></i>';
    }
    all.innerHTML = dots2 +
      '<span class="bdg">九关全部通关</span>'+
      '<div class="dsc">九类客户你都走通了。把九张话术卡带回去，<b>每次拜访前花三分钟过一遍对应那张</b>——这个工具就算用到位了。</div>';
    $('stage').appendChild(all);
  }
  recRender();
}

function recRender(){
  const rows=log.filter(e=>e.type==='me').map((e,i)=>'第'+(i+1)+'句　'+e.text);
  $('rec').innerHTML = rows.length ? rows.map(r=>'<div>'+esc(r)+'</div>').join('') : '<div style="color:#9AA1AE">还没开始</div>';
}

function pickCard(id){
  if(!gateUnlocked(GATES.findIndex(g=>g.includes(id)))) return;
  card=id; cur='t1'; log=[]; done={}; ORDER={}; passed=false;
  render(); renderMeta(); renderMap();
  window.scrollTo({top:0, behavior:'smooth'});
}
function goNext(){
  const n=nextCard();
  if(n) pickCard(n);
}
function restart(){
  cur='t1'; log=[]; done={}; ORDER={}; passed=false;
  render();
}
function cp(){
  const ta=$('ta');
  ta.removeAttribute('readonly'); ta.select(); ta.setSelectionRange(0,99999);
  let ok=false;
  try{ ok=document.execCommand('copy'); }catch(e){}
  ta.setAttribute('readonly','readonly');
  if(!ok && navigator.clipboard){ navigator.clipboard.writeText(ta.value).then(()=>alert('已复制')); return; }
  alert(ok?'已复制':'复制失败，请手动全选复制');
}

/* 初始：默认进入第一张没通关的卡 */
(function init(){
  let start='lin';
  outer: for(let g=0; g<GATES.length; g++){
    if(!gateUnlocked(g)) break;
    for(const id of GATES[g]) if(!prog[id]){ start=id; break outer; }
  }
  card=start; cur='t1';
  render(); renderMeta(); renderMap();
})();
</script>
