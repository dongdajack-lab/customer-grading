<body>

<header>
  <h1>利兴纺织 · 线索判断练习</h1>
  <p>线索 vs 机会判断训练 · 共8题</p>
  <span class="brand-tag">大董老师 · 天地人销售管理体系</span>
</header>

<div class="container">
  <div id="quizPage">
    <div class="tip-box">
      <strong>🔑 核心概念（利兴销售必记）：</strong><br>
      <span class="tag tag-lead">线索</span>只是「可能有需求的信息」，还没验证，不能算机会。<br>
      <span class="tag tag-opp">机会</span>是「已验证有真实需求+预算+决策权+时间线」的潜在订单。<br>
      <span class="tag tag-fake">假线索</span>是「永远不会有订单的虚假信息」，要果断放弃。<br>
      <span class="tag tag-nurture">培育线索</span>是「有需求但时机未到」，要定期跟进，不能放弃。<br>
      <strong style="color:#B85042;">判断标准：有没有验证过需求、预算、决策权和时间线？</strong>
    </div>
    <div class="progress-text" id="progressText"></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="card" id="questionCard"></div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="btnPrev" onclick="prevQ()" disabled>上一题</button>

      <span class="unit">分</span>
      <span class="sub-label">百分制</span>

  </div>

<script>
const questions = [
  // 第1题：线索 vs 机会的基本定义（利兴场景）
  {
    scenario: "利兴销售员小刘在广交会上收集了<strong>32张客户名片</strong>，回国后逐一打电话跟进。以下是对其中一位客户（安踏采购员小陈）的第一次电话沟通记录：<br><br>『陈先生，您好！我在广交会上拿过您的名片，想了解一下安踏今年有没有新的面料采购计划？』<br>『哦，我是新来的，不太清楚，你可以发份资料给我们采购部邮箱。』",
    question: "这个小陈，目前是利兴的<strong>线索</strong>还是<strong>机会</strong>？",
    options: [
      { text:"是机会。因为小陈确认了安踏有采购计划，只是不清楚具体情况，只要发资料就有机会。", type:"错误判断", correct:false },
      { text:"是线索。目前只是拿到了一个联系人方式和一句模糊回应，没有验证需求、预算、决策权和时间线，不能算机会。", type:"正确判断", correct:true },
      { text:"是假线索。小陈是新来的，不了解情况，跟进他浪费时间。", type:"错误判断", correct:false },
      { text:"是培育线索。安踏是大品牌，虽然现在不清楚情况，但长期肯定有需求，应该持续跟进。", type:"错误判断", correct:false }
    ],
    explain:"<strong>✅ 正确：是线索，不是机会</strong><br><br>线索的特征：<br>① 有联系方式，但<strong>没验证需求</strong>（小陈说不清楚有没有采购计划）<br>② <strong>没验证预算</strong>（没聊到预算）<br>③ <strong>没验证决策权</strong>（小陈是新来的采购员，不是决策人）<br>④ <strong>没验证时间线</strong>（没聊到什么时候采购）<br><br><strong>正确做法</strong>：把小陈列为线索，发资料到采购部邮箱，同时想办法联系采购部决策人（采购总监或经理），验证以上四个要素后，再决定是否转为机会。"
  },

  // 第2题：什么条件下可以把线索转为机会（利兴向内衣品牌销售）
  {
    scenario: "利兴销售主管老张正在跟进<strong>都市丽人</strong>。以下是他对这个客户的跟进记录：<br><br>① 3月5日：在行业展会上拿到都市丽人采购总监李总的名片。<br>② 3月12日：电话联系李总，李总说『今年我们确实在找新的模杯布供应商，因为现有供应商的回弹率不达标，导致退货率高』。<br>③ 3月15日：给李总发了利兴的模杯布测试报告。<br>④ 3月20日：李总回复『报告看了，数据不错。我们今年模杯布采购预算是800-1000万元，我是决策人之一，但还要和供应链副总一起定。4月中旬我们会开供应商评审会。』<br>⑤ 3月25日：李总同意4月2日带样品去都市丽人办公室做面对面交流。",
    question: "根据以上信息，都市丽人在<strong>什么时候</strong>可以从「线索」转为「机会」？",
    options: [
      { text:"3月5日，拿到李总名片的时候。因为已经有了联系人，可以开始跟进。", type:"过早", correct:false },
      { text:"3月12日，李总确认有需求的时候。因为客户亲口说出了痛点（退货率高），说明有真实需求。", type:" Partial验证", correct:false },
      { text:"3月20日，李总确认了需求、预算、决策权限和评审时间线的时候。四个要素都验证了，可以转为机会，开始正式跟进。", type:"正确时机", correct:true },
      { text:"3月25日，李总同意面对面交流的时候。因为客户愿意见面，说明意向很强，可以转为机会。", type:"过晚", correct:false }
    ],
    explain:"<strong>✅ 正确：3月20日，四要素验证齐全时转为机会</strong><br><br>机会的四个验证要素（利兴销售必查）：<br>① <strong>需求</strong>：李总亲口说「现有供应商回弹率不达标，导致退货率高」——痛点清晰<br>② <strong>预算</strong>：李总说「今年模杯布采购预算800-1000万元」——有预算范围<br>③ <strong>决策权</strong>：李总说「我是决策人之一，但还要和供应链副总一起定」——有决策参与权，知道决策流程<br>④ <strong>时间线</strong>：李总说「4月中旬开供应商评审会」——有明确时间节点<br><br><strong>3月20日之后</strong>，这个客户应该从CRM的「线索池」移到「机会池」，开始正式的销售跟进动作（送样、方案、报价等）。"
  },

  // 第3题：假线索识别（利兴常见陷阱）
  {
    scenario: "利兴销售员小王收到一封邮件：『我们是越南新成立的服装工厂，年产能500万件，正在寻找长期面料供应商。请报价：你们最便宜的涤纶面料多少钱一米？我们希望能拿到中国市场最低价。』小王很兴奋，觉得是个大客户，花了一整天准备报价方案和公司介绍。",
    question: "这个越南客户，最可能是以下哪种情况？",
    options: [
      { text:"是机会。年产能500万件是大工厂，肯定有真实需求，值得认真跟进。", type:"误判", correct:false },
      { text:"是假线索。『要最便宜的面料』和『希望拿到中国市场最低价』说明他只关心价格，不会成为利兴的目标客户（利兴定位是中高端面料，不是低价竞争）。", type:"假线索", correct:true },
      { text:"是培育线索。越南新工厂确实有需求，只是现在还在价格对比阶段，应该持续跟进，等他预算够了再合作。", type:"误判", correct:false },
      { text:"无法判断。需要实地拜访之后才能确定是不是机会。", type:"过于谨慎", correct:false }
    ],
    explain:"<strong>✅ 正确：是假线索</strong><br><br>假线索的特征（利兴销售要警惕）：<br>① <strong>只关心价格，不关心品质</strong>：「最便宜」「市场最低价」——利兴的定位是<strong>中高端功能性面料</strong>，不是低价供应商。这个客户和利兴的目标客户画像不匹配。<br>② <strong>没有具体需求描述</strong>：「最便宜的涤纶面料」——连具体用途、性能要求都没说，说明他只是在<strong>广撒网询价</strong>，不是有针对性的采购。<br>③ <strong>正确做法</strong>：回复一句「感谢询价，利兴专注中高端功能性面料，最低价不是我们的定位，如果您对冲孔、透气、抗菌等功能有需求，我们可以进一步交流」，然后<strong>不再主动跟进</strong>。如果对方有真实高端需求，会主动回复；如果只是比价，就不会再联系了。"
  },

  // 第4题：培育线索识别（有需求但时机未到）
  {
    scenario: "利兴销售员小陈去拜访<strong>越南海防市一家新成立的运动服工厂</strong>。工厂去年刚动工建设，目前厂房还在装修，预计<strong>明年3月</strong>才能正式投产。厂长张总很热情地接待了小陈，说：『我们的运动服定位是中高端，对面料的透气性、抗菌性要求很高。你们的样品我很满意，但我们现在还没开始采购，等明年投产后，我会第一个联系你们。』",
    question: "这个越南工厂，应该归类为？",
    options: [
      { text:"是假线索。因为明年3月才投产，今年不会有任何订单，跟进他是浪费时间。", type:"误判", correct:false },
      { text:"是机会。张总对利兴的样品很满意，而且有明确的需求（透气性、抗菌性），应该现在就开始送样、报价，争取明年一投产就下单。", type:"过于乐观", correct:false },
      { text:"是培育线索。有真实需求和对利兴产品的认可，但采购时间线在明年3月，现在不能算机会（因为今年不会有订单），但也不能放弃，应该定期跟进（每季度发一次新品信息，明年1月再次拜访）。", type:"正确判断", correct:true },
      { text:"无法判断。要等明年工厂投产之后再联系，现在联系太早了。", type:"过于消极", correct:false }
    ],
    explain:"<strong>✅ 正确：是培育线索</strong><br><br>培育线索的特征：<br>① <strong>有真实需求</strong>：张总明确说了透气性、抗菌性要求，而且对面料品质有要求（中高端定位）<br>② <strong>对利兴产品认可</strong>：张总说「你们的样品我很满意」<br>③ <strong>但采购时间线未到</strong>：明年3月才投产，今年不会有订单<br><br><strong>培育线索的正确做法</strong>：<br>• 记入CRM「培育线索池」，设置<strong>定期跟进提醒</strong>（每季度发一次利兴新品信息）<br>• <strong>明年1月</strong>（投产前2个月）再次拜访，带最新样品和正式报价<br>• 不要每个月都联系（会打扰客户），但也不能不联系（会被竞争对手抢先）"
  },

  // 第5题：多线索优先级排序（利兴销售时间管理）
  {
    scenario: "利兴销售员小刘今天早上打开CRM，发现有<strong>4个待跟进的线索</strong>，但他今天只有时间深度跟进其中1个。以下是4个线索的情况：<br><br>【甲】安踏：采购总监王总，已确认今年有运动面料采购计划，预算约500万元，4月中旬开评审会，已经收到利兴的测试报告，回复「数据不错」。<br><br>【乙】李宁：采购员小赵，在展会上拿过利兴的资料，说「会有采购需求，但不确定时间」，还没验证预算和决策权。<br><br>【丙】都市丽人：采购总监李总，已确认模杯布需求，预算800-1000万元，4月中旬评审会，已同意4月2日带样品去面对面交流。<br><br>【丁】越南某新工厂：厂长张总，厂房还在装修，明年3月才投产，今年不会有采购。",
    question: "如果今天只能深度跟进1个，应该优先选哪个？",
    options: [
      { text:"优先选甲（安踏）。因为安踏是大品牌，订单量大，先跟进大品牌。", type:"仅凭品牌大小", correct:false },
      { text:"优先选乙（李宁）。因为李宁的采购员小赵是展会拿的资料，说明主动性强，应该优先跟进。", type:"错误标准", correct:false },
      { text:"优先选丙（都市丽人）。因为丙已经同意面对面交流（4月2日），而且评审会在4月中旬，时间最紧迫，成交概率最高。", type:"正确优先级", correct:true },

let current = 0;
let selected = null;
let answered = false;
let results = [];

function renderQuestion() {
  selected = null;
  answered = false;
  var q = questions[current];

  document.getElementById("progressText").textContent = "第 " + (current+1) + " 题 / 共 " + questions.length + " 题";
  document.getElementById("progressFill").style.width = (current / questions.length * 100) + "%";

  document.getElementById("btnNext").textContent = "确认答案";
  document.getElementById("btnNext").disabled = true;
  document.getElementById("btnNext").onclick = nextQ;
  document.getElementById("btnPrev").disabled = (current === 0);

  var card = document.getElementById("questionCard");
  var html = '<div class="question-badge">第 ' + (current+1) + ' 题</div>';
  html += '<div class="scenario"><span class="label">【利兴业务场景】</span><br>' + q.scenario + '</div>';
  html += '<div style="font-weight:600; margin:14px 0 8px; color:#333; font-size:15px;">' + q.question + '</div>';
  html += '<div class="options">';
  var labels = ['A', 'B', 'C', 'D'];
  for (var i = 0; i < q.options.length; i++) {
    var o = q.options[i];
    html += '<div class="option" id="opt' + i + '" onclick="selectOption(' + i + ')">';
    html += '  <div class="radio"></div>';
    html += '  <div class="text"><span class="opt-label">[' + labels[i] + ']</span> ' + o.text + '</div>';
    html += '</div>';
  }
  html += '</div>';
  html += '<div class="correct-answer" id="correctAnswer"></div>';
  html += '<div class="explanation" id="explanation">';
  html += '  <h4>📚 解析</h4>';
  html += '  <p>' + q.explain + '</p>';
  html += '</div>';
  card.innerHTML = html;
}

function selectOption(idx) {
  if (answered) return;
  selected = idx;
  var opts = document.querySelectorAll(".option");
  for (var i = 0; i < opts.length; i++) {
    opts[i].classList.toggle("selected", i === idx);
  }
  document.getElementById("btnNext").disabled = false;
}

function nextQ() {
  if (selected === null) return;
  var q = questions[current];
  var isCorrect = q.options[selected].correct;
  answered = true;

  var opts = document.querySelectorAll(".option");
  for (var i = 0; i < opts.length; i++) {
    if (q.options[i].correct) opts[i].classList.add("correct");
    if (i === selected && !isCorrect) opts[i].classList.add("wrong");
    opts[i].onclick = null;
  }

  results[current] = isCorrect;

  var labels = ['A', 'B', 'C', 'D'];
  var correctIdx = q.options.findIndex(function(o) { return o.correct === true; });
  var correctLabel = labels[correctIdx];
  var correctText = q.options[correctIdx].text;
  document.getElementById('correctAnswer').innerHTML =
    '<div class="label">✅ 正确答案：' + correctLabel + '</div>' +
    '<div style="margin-top:6px; color:#333;">' + correctText + '</div>';
  document.getElementById('correctAnswer').classList.add('show');

  document.getElementById("explanation").classList.add("show");

  if (current < questions.length - 1) {
    document.getElementById("btnNext").textContent = "下一题 →";
    document.getElementById("btnNext").onclick = function() { current++; renderQuestion(); };
  } else {
    document.getElementById("btnNext").textContent = "查看结果";
    document.getElementById("btnNext").onclick = showResult;
  }
  document.getElementById("btnNext").disabled = false;
}

function prevQ() {
  if (current > 0) { current--; renderQuestion(); }
}

function showResult() {
  document.getElementById("quizPage").style.display = "none";
  document.getElementById("resultPage").classList.add("show");

  var score = 0;
  for (var i = 0; i < results.length; i++) {
    if (results[i]) score++;
  }
  var percent = Math.round(score / results.length * 100);
  document.getElementById("scoreNum").textContent = score;
  document.getElementById("percentNum").textContent = percent;

  var detailHTML = "<h3>📊 答题详情</h3>";
  for (var i = 0; i < results.length; i++) {
    var icon = results[i] ? "✅" : "❌";
    var text = results[i] ? "正确" : "错误";
    detailHTML += '<div class="result-item"><span class="status">' + icon + '</span><span>第 ' + (i+1) + ' 题：' + text + '</span></div>';
  }
  document.getElementById("resultDetail").innerHTML = detailHTML;
}

function restart() {
  current = 0;
  selected = null;
  answered = false;
  results = [];
  document.getElementById("quizPage").style.display = "block";
  document.getElementById("resultPage").classList.remove("show");
  renderQuestion();
}

renderQuestion();
</script>
