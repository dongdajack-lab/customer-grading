let currentQ = 0;
let answers = new Array(questions.length).fill(null);
let scores = { D:0, I:0, S:0, C:0 };

// ============ 开始测评 ============
function startQuiz(){
  document.getElementById('coverPage').style.display='none';
  document.getElementById('quizPage').style.display='block';
  currentQ = 0;
  answers = new Array(questions.length).fill(null);
  scores = { D:0, I:0, S:0, C:0 };
  renderQuestion();
}

// ============ 渲染题目 ============
function renderQuestion(){
  const q = questions[currentQ];
  document.getElementById('qNum').textContent = '第 ' + (currentQ+1) + ' 题';
  document.getElementById('qTotal').textContent = '共 ' + questions.length + ' 题';
  document.getElementById('progressFill').style.width = ((currentQ)/questions.length)*100 + '%';

  const card = document.getElementById('questionCard');
  const letters = ['A','B','C','D'];
  const dimLabels = { D:'支配(D)', I:'影响(I)', S:'稳健(S)', C:'服从(C)' };

  let optionsHtml = '';
  for(let i=0; i<q.o.length; i++){
    const o = q.o[i];
    const isSelected = answers[currentQ] === i;
    optionsHtml += '<div class="option ' + (isSelected?'selected':'') + '" onclick="selectOpt(' + i + ')">' +
      '<div class="opt-letter">' + letters[i] + '</div>' +
      '<div class="opt-text">' +
        o.t +
        '<div class="opt-dim">' + dimLabels[o.dim] + '</div>' +
      '</div>' +
    '</div>';
  }

  card.innerHTML = '<div class="q-title">' + q.q + '</div>' +
    '<div class="q-subtitle">请选择最符合你平时行为的选项</div>' +
    '<div class="options">' + optionsHtml + '</div>';

  document.getElementById('btnPrev').disabled = currentQ===0;
  const isLast = currentQ===questions.length-1;
  document.getElementById('btnNext').textContent = isLast ? '查看结果' : '确认';
  document.getElementById('btnNext').disabled = answers[currentQ]===null;
}

// ============ 选择选项 ============
function selectOpt(idx){
  answers[currentQ] = idx;
  renderQuestion();
}

// ============ 上一题/下一题 ============
function prevQ(){
  if(currentQ>0){ currentQ--; renderQuestion(); }
}
function nextQ(){
  if(answers[currentQ]===null) return;
  if(currentQ < questions.length-1){
    currentQ++;
    renderQuestion();
  } else {
    finishQuiz();
  }
}

// ============ 答题卡 ============
function showAnswerSheet(){
  const grid = document.getElementById('answerGrid');
  grid.innerHTML = '';
  for(let i=0; i<questions.length; i++){
    const cell = document.createElement('div');
    let cls = 'answer-cell';
    if(answers[i] !== null) cls += ' answered';
    if(i === currentQ) cls += ' current';
    cell.className = cls;
    cell.textContent = i+1;
    cell.onclick = (function(idx){
      return function(){ currentQ=idx; renderQuestion(); closeAnswerSheet(); };
    })(i);
    grid.appendChild(cell);
  }
  document.getElementById('answerSheetModal').classList.add('show');
}
function closeAnswerSheet(){
  document.getElementById('answerSheetModal').classList.remove('show');
}

// ============ 计算得分 ============
function calcScores(){
  scores = { D:0, I:0, S:0, C:0 };
  for(let i=0; i<questions.length; i++){
    if(answers[i] !== null){
      const dim = questions[i].o[answers[i]].dim;
      scores[dim]++;
    }
  }
}

// ============ 四路判断算法 ============
function matchType(){
  const arr = [
    { dim:'D', score:scores.D },
    { dim:'I', score:scores.I },
    { dim:'S', score:scores.S },
    { dim:'C', score:scores.C }
  ];
  // 多级排序：先按分数降序，同分时按 D>C>S>I 优先级（数字小=优先）
  const dimPriority = { 'D':0, 'C':1, 'S':2, 'I':3 };
  arr.sort(function(a,b){
    if(b.score !== a.score) return b.score - a.score;
    return dimPriority[a.dim] - dimPriority[b.dim];
  });

  const maxScore = arr[0].score;
  const minScore = arr[3].score;
  const secondScore = arr[1].score;
  const thirdScore = arr[2].score;

  // 第一路：变色龙型（四维度均衡）
  if( (maxScore - minScore) <= 3 && minScore >= 3 ){
    return types["CHAMELEON"];
  }

  // 第二路：单一主导型（最高分明显领先）
  if( maxScore >= secondScore + 3 ){
    return types[arr[0].dim];
  }

  // 第三路：组合型
  // 当第二第三同分时，优先尝试三字母类型（如 DIS, DIC, SCI, ISC）
  if( secondScore === thirdScore ){
    // 尝试三字母：arr[0]+arr[1]+arr[2]
    var tripleKey = arr[0].dim + arr[1].dim + arr[2].dim;
    if(types[tripleKey]) return types[tripleKey];
    // 尝试 arr[0]+arr[2]+arr[1]
    var tripleKey2 = arr[0].dim + arr[2].dim + arr[1].dim;
    if(types[tripleKey2]) return types[tripleKey2];
    // 尝试 arr[1]+arr[0]+arr[2]
    var tripleKey3 = arr[1].dim + arr[0].dim + arr[2].dim;
    if(types[tripleKey3]) return types[tripleKey3];
    // 尝试 arr[1]+arr[2]+arr[0]
    var tripleKey4 = arr[1].dim + arr[2].dim + arr[0].dim;
    if(types[tripleKey4]) return types[tripleKey4];
  }

  // 取前两维拼接（按优先级排好了序）
  var key = arr[0].dim + arr[1].dim;
  if(types[key]){
    return types[key];
  }
  var key2 = arr[1].dim + arr[0].dim;
  if(types[key2]){
    return types[key2];
  }

  // 第四路：无特征型（分数都低，建议重测）
  if( maxScore <= 3 ){
    return {
      name:"建议重测",
      fullName:"得分偏低 · 建议重新测评",
      keywords:"得分分散、建议重测、结果参考性有限",
      desc:"你的各维度得分均较低（最高分≤3），可能是答题时未能准确反映自己的真实行为风格。建议找一个安静的时间，凭第一直觉重新作答，不要过多思考「应该」怎么选，而是选「实际上」怎么做的。",
      adv:["诚实作答才能得到准确结果","建议在放松状态下重新测评","可以请熟悉你的同事朋友帮你对照评价"],
      dis:["当前结果参考性有限","得分过低可能意味着答题不够认真","建议重测后再查看结果"],
      tips:["凭第一直觉作答，不要过多思考","每题选最符合你平时真实行为的选项","重测后结果会更准确"]
    };
  }

  // 兜底：返回最高分类型
  return types[arr[0].dim];
}

// ============ 完成测评 ============
function finishQuiz(){
  calcScores();
  const type = matchType();

  document.getElementById('quizPage').style.display='none';
  const rp = document.getElementById('resultPage');
  rp.style.display='block';

  const maxScore = questions.length;

  let html = '';
  html += '<div class="result-hero">' +
    '<div class="result-type-badge">🧠 你的DISC类型</div>' +
    '<div class="result-type-name">' + type.name + '</div>' +
    '<div class="result-type-label">' + type.fullName + '</div>' +
    '<div style="margin-top:16px;font-size:13px;opacity:0.9;">人格关键词：' + type.keywords + '</div>' +
  '</div>';

  html += '<div class="radar-wrap">' +
    '<h3>📊 四维度雷达图</h3>' +
    '<canvas id="radarChart" width="280" height="280"></canvas>' +
  '</div>';

  html += '<div class="dim-scores">' +
    '<h3>📈 各维度得分</h3>' +
    '<div class="dim-row dim-D">' +
      '<div class="dim-label">D</div>' +
      '<div class="dim-bar-bg"><div class="dim-bar-fill" style="width:0%" id="barD"></div></div>' +
      '<div class="dim-score" style="color:#E74C3C">' + scores.D + '分</div>' +
    '</div>' +
    '<div class="dim-row dim-I">' +
      '<div class="dim-label">I</div>' +
      '<div class="dim-bar-bg"><div class="dim-bar-fill" style="width:0%" id="barI"></div></div>' +
      '<div class="dim-score" style="color:#F39C12">' + scores.I + '分</div>' +
    '</div>' +
    '<div class="dim-row dim-S">' +
      '<div class="dim-label">S</div>' +
      '<div class="dim-bar-bg"><div class="dim-bar-fill" style="width:0%" id="barS"></div></div>' +
      '<div class="dim-score" style="color:#27AE60">' + scores.S + '分</div>' +
    '</div>' +
    '<div class="dim-row dim-C">' +
      '<div class="dim-label">C</div>' +
      '<div class="dim-bar-bg"><div class="dim-bar-fill" style="width:0%" id="barC"></div></div>' +
      '<div class="dim-score" style="color:#3498DB">' + scores.C + '分</div>' +
    '</div>' +
  '</div>';

  html += '<div class="detail-card">' +
    '<h3><span class="icon">📋</span> 行为描述</h3>' +
    '<div class="detail-section"><p>' + type.desc + '</p></div>' +
  '</div>';

  html += '<div class="detail-card">' +
    '<h3><span class="icon">✅</span> 你的优势</h3>' +
    '<div class="tag-list">' +
      type.adv.map(function(a){ return '<span class="tag tag-adv">' + a + '</span>'; }).join('') +
    '</div></div>';

  html += '<div class="detail-card">' +
    '<h3><span class="icon">⚠️</span> 需要注意的劣势</h3>' +
    '<div class="tag-list">' +
      type.dis.map(function(d){ return '<span class="tag tag-dis">' + d + '</span>'; }).join('') +
    '</div></div>';

  html += '<div class="detail-card">' +
    '<h3><span class="icon">💡</span> 提升建议</h3>' +
    '<div class="tag-list">' +
      type.tips.map(function(t){ return '<span class="tag tag-tip">' + t + '</span>'; }).join('') +
    '</div></div>';

  html += '<div class="detail-card">' +
    '<h3><span class="icon">🎓</span> 大董老师点评</h3>' +
    '<div class="detail-section"><p>作为销售从业者，了解自己的DISC性格类型有助于你更好地发挥优势、避开盲区。' +
    type.name + '类型的你在销售过程中，建议重点发挥<b>' + type.adv[0] + '</b>这一核心优势，同时有意识地改善<b>' + type.dis[0] + '</b>这一潜在短板。记住：没有最好的性格，只有最懂得发挥自己优势的人！</p></div>' +
  '</div>';

  html += '<div class="share-row">' +
    '<button class="share-btn" onclick="shareResult()">📤 分享结果</button>' +
    '<button class="share-btn" onclick="saveImage()">📷 保存图片</button>' +
    '</div>' +
    '<button class="restart-btn-full" onclick="restartQuiz()">🔄 重新测评</button>';

  rp.innerHTML = html;

  setTimeout(function(){
    document.getElementById('barD').style.width = (scores.D/maxScore)*100 + '%';
    document.getElementById('barI').style.width = (scores.I/maxScore)*100 + '%';
    document.getElementById('barS').style.width = (scores.S/maxScore)*100 + '%';
    document.getElementById('barC').style.width = (scores.C/maxScore)*100 + '%';
  }, 100);

  setTimeout(drawRadar, 200);
}

// ============ 雷达图（满分20）============
function drawRadar(){
  const canvas = document.getElementById('radarChart');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const cx = w/2, cy = h/2, r = 110;

  ctx.clearRect(0,0,w,h);

  const labels = ['支配(D)','影响(I)','稳健(S)','服从(C)'];
  const vals = [
    scores.D/questions.length,
    scores.I/questions.length,
    scores.S/questions.length,
    scores.C/questions.length
  ];
  const colors = ['#E74C3C','#F39C12','#27AE60','#3498DB'];

  for(let g=1; g<=4; g++){
    const gr = r*g/4;
    ctx.beginPath();
    for(let i=0; i<4; i++){
      const angle = (Math.PI*2*i/4) - Math.PI/2;
      const x = cx + Math.cos(angle)*gr;
      const y = cy + Math.sin(angle)*gr;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.strokeStyle = '#e0e6ed';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  ctx.font = '12px PingFang SC, sans-serif';
  for(let i=0; i<4; i++){
    const angle = (Math.PI*2*i/4) - Math.PI/2;
    const lx = cx + Math.cos(angle)*(r+20);
    const ly = cy + Math.sin(angle)*(r+20);
    ctx.fillStyle = colors[i];
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(labels[i], lx, ly);
    ctx.font = '11px PingFang SC, sans-serif';
    ctx.fillText(Math.round(vals[i]*100) + '分', lx, ly+14);
    ctx.font = '12px PingFang SC, sans-serif';
  }

  ctx.beginPath();
  for(let i=0; i<4; i++){
    const angle = (Math.PI*2*i/4) - Math.PI/2;
    const x = cx + Math.cos(angle)*r*vals[i];
    const y = cy + Math.sin(angle)*r*vals[i];
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(52,152,219,0.25)';
  ctx.fill();
  ctx.strokeStyle = '#3498DB';
  ctx.lineWidth = 2;
  ctx.stroke();

  for(let i=0; i<4; i++){
    const angle = (Math.PI*2*i/4) - Math.PI/2;
    const x = cx + Math.cos(angle)*r*vals[i];
    const y = cy + Math.sin(angle)*r*vals[i];
    ctx.beginPath();
    ctx.arc(x,y,5,0,Math.PI*2);
    ctx.fillStyle = colors[i];
    ctx.fill();
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

// ============ 分享 & 保存 ============
function shareResult(){
  const typeName = document.querySelector('.result-type-name');
  const typeLabel = document.querySelector('.result-type-label');
  const text = '【我的DISC性格测评结果】\n类型：' +
    (typeName ? typeName.textContent : '') + '\n' +
    (typeLabel ? typeLabel.textContent : '') + '\n来测测你的性格类型吧！';
  if(navigator.share){
    navigator.share({title:'DISC性格测评结果',text:text});
  } else if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(function(){ alert('结果已复制到剪贴板，快去分享吧！'); });
  } else {
    alert('请截图分享您的结果！');
  }
}
function saveImage(){
  const canvas = document.getElementById('radarChart');
  if(canvas){
    const link = document.createElement('a');
    link.download = 'DISC性格测评结果.png';
    link.href = canvas.toDataURL();
    link.click();
  } else {
    alert('请直接截图保存您的结果页面！');
  }
}
function restartQuiz(){
  document.getElementById('resultPage').style.display='none';
  document.getElementById('coverPage').style.display='block';
}

// ============ 键盘快捷键 ============
document.addEventListener('keydown', function(e){
  if(document.getElementById('quizPage').style.display !== 'block') return;
  if(e.key >= '1' && e.key <= '4') selectOpt(parseInt(e.key)-1);
  if(e.key === 'ArrowRight' || e.key === 'Enter') nextQ();
  if(e.key === 'ArrowLeft') prevQ();
});
