<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>美琳&琳娜的贪吃蛇</title>
<style>
  :root{
    --bg1:#f5efe3; --bg2:#e9e0cc;
    --card:#ffffff; --ink:#2c2418; --muted:#8a7c66;
    --accent:#B85042; --accent2:#336633;
    --line:#e3dcc9;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    color:var(--ink); min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:18px 14px 40px;
  }
  header{width:100%; max-width:680px; display:flex; align-items:baseline; gap:12px; margin-bottom:14px; flex-wrap:wrap;}
  header h1{font-size:26px; margin:0; letter-spacing:2px;}
  header .sub{color:var(--muted); font-size:13px;}
  .wrap{width:100%; max-width:680px; display:flex; flex-direction:column; gap:14px;}
  .board-shell{
    position:relative; border-radius:16px; overflow:hidden;
    background:radial-gradient(ellipse at 30% 20%, #f2e6c4, #e2cf94 55%, #d3ba72);
    box-shadow:0 10px 30px rgba(90,64,20,.18), inset 0 0 0 1px rgba(120,85,30,.25);
    padding:10px;
  }
  canvas#game{display:block; width:100%; border-radius:10px; touch-action:none;}
  .overlay{
    position:absolute; inset:10px; border-radius:10px;
    background:rgba(44,36,24,.55); backdrop-filter:blur(2px);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; text-align:center; padding:20px; gap:10px;
  }
  .overlay.hidden{display:none;}
  .overlay h2{margin:0; font-size:28px; letter-spacing:2px;}
  .overlay p{margin:0; font-size:14px; line-height:1.8; color:#f0e6d0;}
  .overlay .big{font-size:40px; font-weight:800; color:#ffd76e; line-height:1.2;}
  .panel{display:flex; gap:14px; flex-wrap:wrap;}
  .card{
    flex:1 1 200px; background:var(--card); border-radius:14px; padding:14px 18px;
    box-shadow:0 4px 16px rgba(90,64,20,.08); border:1px solid var(--line);
  }
  .scores{display:flex; gap:22px; font-size:13.5px; color:var(--muted);}
  .scores b{color:var(--ink); font-size:20px; display:block; font-variant-numeric:tabular-nums;}
  .scores .rec b{color:var(--accent);}
  .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  label{font-size:13px; color:var(--muted);}
  select,button{
    font:inherit; font-size:14px; padding:7px 12px; border-radius:9px;
    border:1px solid var(--line); background:#faf7ef; color:var(--ink); cursor:pointer;
  }
  .btns{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  button.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  button.primary:hover{background:#a04436;}
  button.green{background:var(--accent2); border-color:var(--accent2); color:#fff;}
  button.green:hover{background:#2a522a;}
  button:hover{background:#f2ecdc;}
  button:active{transform:scale(.97);}
  .hint{font-size:12px; color:var(--muted); line-height:1.8;}
  /* 手机方向键 */
  .dpad{display:none; margin:2px auto 0; width:180px;}
  .dpad .drow{display:flex; justify-content:center; gap:8px; margin:6px 0;}
  .dpad button{
    width:56px; height:56px; font-size:22px; border-radius:14px; background:#faf7ef;
    border:1px solid var(--line);
  }
  @media (pointer:coarse){ .dpad{display:block;} }
</style>
</head>
<body>
<header>
  <h1>🐍 美琳&amp;琳娜的贪吃蛇</h1>
  <div class="sub">吃苹果变长 · 别咬自己 · 撞墙扣命</div>
</header>
<div class="wrap">
  <div class="board-shell">
    <canvas id="game" width="600" height="600"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">准备好了吗？</h2>
      <div class="big" id="ovBig" style="display:none;">0</div>
      <p id="ovText">现在是「超简单」模式：蛇走得慢、不会咬到自己、还能穿墙 🐣<br>电脑：方向键 / WASD，空格暂停<br>手机：滑动画布或用屏幕方向键</p>
      <div class="row" style="justify-content:center;">
        <button class="primary" id="ovBtn" style="padding:10px 28px;">开始游戏</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="card">
      <div class="scores">
        <div class="rec"><span id="hiLabel">最高分 · 超简单</span><b id="hiScore">0</b></div>
        <div>当前得分<b id="score">0</b></div>
        <div>长度<b id="lenScore">3</b></div>
      </div>
    </div>
    <div class="card">
      <div class="row">
        <div><label>难度</label><br>
          <select id="selDiff">
            <option value="super" selected>超简单（小朋友）</option>
            <option value="easy">简单</option>
            <option value="classic">经典</option>
            <option value="hard">挑战（快）</option>
          </select>
        </div>
        <div id="livesBox" style="display:none;"><label>生命</label><br>
          <span id="lives" style="font-size:20px; letter-spacing:2px;">❤❤❤</span>
        </div>
      </div>
      <div class="hint" id="diffHint" style="margin-top:10px;"></div>
    </div>
  </div>

  <div class="card">
    <div class="btns">
      <button id="btnStart" class="primary">开始 / 重新开始</button>
      <button id="btnPause">暂停</button>
      <button id="btnResign" style="grid-column:span 2;">结束并保存成绩</button>
    </div>
    <div id="statusLine" style="min-height:20px; font-size:14px; font-weight:600; color:var(--accent); text-align:center; margin-top:8px;"></div>
    <div class="hint" style="margin-top:6px;">
      规则：吃到 🍎 得 10 分并变长一节；连续快速吃到会有连击加分。超简单模式不咬自己、可穿墙，还有 3 条命。最高分会自动保存在本机（不同难度分开记）。
    </div>
  </div>

  <div class="dpad">
    <div class="drow"><button data-dir="U">▲</button></div>
    <div class="drow">
      <button data-dir="L">◀</button>
      <button data-dir="D">▼</button>
      <button data-dir="R">▶</button>
    </div>
  </div>
</div>

<script>
/* ================== 贪吃蛇 ================== */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);

/* 难度预设：超简单专为小朋友设计 */
const DIFF = {
  super:   { cols:14, speed:270, wall:'pass', selfPass:true,  lives:3, name:'超简单',
             hint:'🐣 棋盘小、蛇走得慢、可以穿墙、不会咬到自己，还有 3 条命，放心大胆玩！' },
  easy:    { cols:18, speed:180, wall:'pass', selfPass:false, lives:2, name:'简单',
             hint:'🙂 棋盘中等、速度较慢、可以穿墙，但会咬到自己，有 2 条命。' },
  classic: { cols:24, speed:110, wall:'wall', selfPass:false, lives:1, name:'经典',
             hint:'🏛 标准棋盘、撞墙会死、只有 1 条命。' },
  hard:    { cols:24, speed:70,  wall:'wall', selfPass:false, lives:1, name:'挑战',
             hint:'🔥 标准棋盘、速度飞快、撞墙会死，1 条命，高手专属！' }
};

const S = {
  snake: [], dir: 'R', nextDir: 'R',
  food: null, score: 0, combo: 0, lastEat: 0,
  running: false, paused: false, dead: false,
  timer: null, speed: 270, wall: 'pass',
  cols: 14, diff: 'super', selfPass: true,
  lives: 3, maxLives: 3, respawn: 0,
  growing: 0, pop: 0
};

const DIRS = { U:[0,-1], D:[0,1], L:[-1,0], R:[1,0] };
const OPP = { U:'D', D:'U', L:'R', R:'L' };

function cellPx(){
  return Math.min(cv.width / S.cols, cv.height / S.cols);
}

function applyDiff(key){
  const d = DIFF[key] || DIFF.super;
  S.diff = key;
  S.cols = d.cols;
  S.speed = d.speed;
  S.wall = d.wall;
  S.selfPass = d.selfPass;
  S.maxLives = d.lives;
  $('diffHint').textContent = d.hint;
  $('livesBox').style.display = d.lives > 1 ? '' : 'none';
}

function reset(keepScore){
  const c = S.cols;
  const cx = Math.floor(c / 2), cy = Math.floor(c / 2);
  S.snake = [{x:cx,y:cy},{x:cx-1,y:cy},{x:cx-2,y:cy}];
  S.dir = 'R'; S.nextDir = 'R';
  if (!keepScore) S.score = 0;
  S.combo = 0; S.growing = 0; S.pop = 0;
  S.respawn = 0;
  S.dead = false; S.paused = false;
  S.lives = S.maxLives;
  spawnFood();
  updatePanel();
  setStatus('');
}

function freeCells(){
  const occ = new Set(S.snake.map(s => s.x + ',' + s.y));
  const r = [];
  for (let x = 0; x < S.cols; x++)
    for (let y = 0; y < S.cols; y++)
      if (!occ.has(x + ',' + y)) r.push({x, y});
  return r;
}

function spawnFood(){
  const cells = freeCells();
  if (!cells.length){ S.food = null; return; }
  S.food = cells[Math.floor(Math.random() * cells.length)];
}

function step(){
  if (!S.running || S.paused || S.dead) return;
  if (S.respawn > 0){ S.respawn--; draw(); return; }
  // 应用转向（不允许直接掉头）
  if (S.nextDir !== OPP[S.dir]) S.dir = S.nextDir;
  const head = S.snake[0];
  const [dx, dy] = DIRS[S.dir];
  let nx = head.x + dx, ny = head.y + dy;
  const N = S.cols;

  if (S.wall === 'pass'){
    nx = (nx + N) % N;
    ny = (ny + N) % N;
  } else if (nx < 0 || ny < 0 || nx >= N || ny >= N){
    return loseLife('撞墙了');
  }

  // 咬到自己（尾巴即将移走的位置除外——若不增长尾巴会腾出）。超简单模式不会死
  if (!S.selfPass){
    const willGrow = S.growing > 0;
    for (let i = 0; i < S.snake.length - (willGrow ? 0 : 1); i++){
      if (S.snake[i].x === nx && S.snake[i].y === ny) return loseLife('咬到自己了');
    }
  }

  S.snake.unshift({x: nx, y: ny});

  if (S.food && nx === S.food.x && ny === S.food.y){
    const now = Date.now();
    if (now - S.lastEat < 1500) S.combo = Math.min(S.combo + 1, 5);
    else S.combo = 1;
    S.lastEat = now;
    const gain = 10 + (S.combo - 1) * 5;
    S.score += gain;
    S.growing += 1;
    S.pop = 8;
    setStatus(S.combo > 1 ? '连击 ×' + S.combo + '　+' + gain + ' 分！' : '好吃！+' + gain + ' 分', 900);
    spawnFood();
    updatePanel();
  }

  if (S.growing > 0) S.growing--;
  else S.snake.pop();

  draw();
}

/* 丢一条命：还有命就原地重来（保留分数），否则真的结束 */
function loseLife(reason){
  S.lives--;
  updatePanel();
  if (S.lives > 0){
    const c = S.cols, cx = Math.floor(c / 2), cy = Math.floor(c / 2);
    S.snake = [{x:cx,y:cy},{x:cx-1,y:cy},{x:cx-2,y:cy}];
    S.dir = 'R'; S.nextDir = 'R'; S.growing = 0;
    S.respawn = 2; // 暂停两拍让小朋友看清
    setStatus('💔 ' + reason + '！还剩 ' + S.lives + ' 条命，继续加油～', 2200);
    draw();
    return;
  }
  return die(reason);
}

function die(reason){
  S.dead = true; S.running = false;
  clearInterval(S.timer);
  const hi = loadHi();
  const isRecord = S.score > hi;
  if (isRecord) saveHi(S.score);
  updatePanel();
  $('ovTitle').textContent = isRecord ? '🎉 新纪录！' : '游戏结束';
  $('ovBig').style.display = 'block';
  $('ovBig').textContent = S.score;
  $('ovText').innerHTML = (reason ? reason + '～<br>' : '') + (isRecord
    ? '打破了之前的最高分 ' + hi + ' 分！<br>点下面再来一局'
    : '本局 ' + S.score + ' 分 · 长度 ' + S.snake.length + ' 节<br>点下面再来一局');
  $('ovBtn').textContent = '再来一局';
  $('overlay').classList.remove('hidden');
  draw();
}

function start(){
  reset(false);
  S.running = true;
  S.dead = false;
  clearInterval(S.timer);
  S.timer = setInterval(step, S.speed);
  $('overlay').classList.add('hidden');
  draw();
}

function togglePause(){
  if (!S.running || S.dead) return;
  S.paused = !S.paused;
  if (S.paused){
    $('ovTitle').textContent = '⏸ 已暂停';
    $('ovBig').style.display = 'none';
    $('ovText').innerHTML = '休息一下～<br>点按钮或按空格继续';
    $('ovBtn').textContent = '继续游戏';
    $('overlay').classList.remove('hidden');
  } else {
    $('overlay').classList.add('hidden');
  }
}

function setDir(d){
  if (!S.running || S.paused || S.dead) return;
  if (d !== OPP[S.dir]) S.nextDir = d;
}

/* ---------- 状态提示 ---------- */
let statusTimer = null;
function setStatus(t, ms){
  $('statusLine').textContent = t || '';
  if (statusTimer) clearTimeout(statusTimer);
  if (t && ms) statusTimer = setTimeout(function(){
    if ($('statusLine').textContent === t) $('statusLine').textContent = '';
  }, ms);
}

/* ---------- 存储（按难度分开记最高分） ---------- */
function hiKey(){ return 'snake-hi-' + S.diff; }
function loadHi(){
  try {
    const v = localStorage.getItem(hiKey());
    if (v !== null) return parseInt(v, 10) || 0;
    // 兼容旧版单一记录
    if (S.diff === 'classic') return parseInt(localStorage.getItem('snake-hi') || '0', 10) || 0;
    return 0;
  } catch(e){ return 0; }
}
function saveHi(v){
  try { localStorage.setItem(hiKey(), String(v)); } catch(e){}
}

function updatePanel(){
  $('score').textContent = S.score;
  $('lenScore').textContent = S.snake.length;
  $('hiScore').textContent = loadHi();
  $('lives').textContent = '❤'.repeat(Math.max(S.lives, 0)) + '♡'.repeat(Math.max(S.maxLives - S.lives, 0));
  $('hiLabel').textContent = '最高分 · ' + DIFF[S.diff].name;
}

/* ---------- 绘制 ---------- */
function draw(){
  const c = cellPx();
  const N = S.cols;
  // 棋盘底
  ctx.clearRect(0, 0, cv.width, cv.height);
  for (let x = 0; x < N; x++){
    for (let y = 0; y < N; y++){
      if ((x + y) % 2 === 0){
        ctx.fillStyle = 'rgba(255,250,230,.35)';
        ctx.fillRect(x*c, y*c, c, c);
      }
    }
  }
  // 超简单/简单模式为可穿墙：画一圈柔和虚线提示
  if (S.wall === 'pass'){
    ctx.save();
    ctx.setLineDash([8, 6]);
    ctx.strokeStyle = 'rgba(51,102,51,.45)';
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, cv.width - 2, cv.height - 2);
    ctx.restore();
  }
  // 食物 🍎
  if (S.food){
    ctx.font = Math.floor(c * 0.9) + 'px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🍎', S.food.x*c + c/2, S.food.y*c + c/2 + c*0.05);
  }
  // 蛇身
  for (let i = S.snake.length - 1; i >= 0; i--){
    const s = S.snake[i];
    const t = 1 - i / Math.max(S.snake.length, 1);
    const pad = c * (0.09 + (1 - t) * 0.06);
    const r = c * 0.28;
    const x = s.x * c + pad, y = s.y * c + pad;
    const w = c - pad * 2;
    roundRect(x, y, w, w, r);
    if (i === 0){
      ctx.fillStyle = '#B85042';
      ctx.shadowColor = 'rgba(184,80,66,.5)';
      ctx.shadowBlur = S.pop > 0 ? 12 : 5;
    } else {
      const g = Math.round(150 - t * 60 + (1 - t) * 30);
      ctx.fillStyle = 'rgb(' + Math.round(60 - t*20) + ',' + Math.round(160 - t*50) + ',' + Math.round(80 - t*25) + ')';
      ctx.shadowBlur = 0;
    }
    ctx.fill();
    ctx.shadowBlur = 0;
    // 眼睛
    if (i === 0){
      const [dx, dy] = DIRS[S.dir];
      const cx = s.x*c + c/2, cy = s.y*c + c/2;
      const ex = -dy, ey = dx; // 垂直于前进方向
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(cx + dx*c*0.12 + ex*c*0.18, cy + dy*c*0.12 + ey*c*0.18, c*0.11, 0, Math.PI*2);
      ctx.arc(cx + dx*c*0.12 - ex*c*0.18, cy + dy*c*0.12 - ey*c*0.18, c*0.11, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.arc(cx + dx*c*0.16 + ex*c*0.18, cy + dy*c*0.16 + ey*c*0.18, c*0.05, 0, Math.PI*2);
      ctx.arc(cx + dx*c*0.16 - ex*c*0.18, cy + dy*c*0.16 - ey*c*0.18, c*0.05, 0, Math.PI*2);
      ctx.fill();
    }
  }
  if (S.pop > 0) S.pop--;
  // 丢命重来提示
  if (S.respawn > 0){
    ctx.fillStyle = 'rgba(44,36,24,.32)';
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold ' + Math.floor(cv.width * 0.085) + 'px sans-serif';
    ctx.fillText('💔 少一条命', cv.width/2, cv.height/2 - cv.width*0.06);
    ctx.font = Math.floor(cv.width * 0.05) + 'px sans-serif';
    ctx.fillText('还剩 ' + S.lives + ' 条命，继续！', cv.width/2, cv.height/2 + cv.width*0.07);
  }
  // 死亡红叉
  if (S.dead){
    const h = S.snake[0];
    ctx.strokeStyle = 'rgba(184,80,66,.9)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(h.x*c + c*0.3, h.y*c + c*0.3);
    ctx.lineTo(h.x*c + c*0.7, h.y*c + c*0.7);
    ctx.moveTo(h.x*c + c*0.7, h.y*c + c*0.3);
    ctx.lineTo(h.x*c + c*0.3, h.y*c + c*0.7);
    ctx.stroke();
  }
}

function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ---------- 事件 ---------- */
document.addEventListener('keydown', function(e){
  const k = e.key.toLowerCase();
  if (k === ' ' || k === 'spacebar'){
    e.preventDefault();
    if (!S.running && !S.dead) start();
    else if (S.dead) start();
    else togglePause();
    return;
  }
  if (k === 'enter' && (!S.running || S.dead)){ start(); return; }
  const map = {
    arrowup:'U', w:'U', arrowdown:'D', s:'D',
    arrowleft:'L', a:'L', arrowright:'R', d:'R'
  };
  if (map[k]){ e.preventDefault(); setDir(map[k]); }
});

// 手机滑动
let tsx = 0, tsy = 0;
cv.addEventListener('touchstart', function(e){
  tsx = e.touches[0].clientX; tsy = e.touches[0].clientY;
}, {passive:true});
cv.addEventListener('touchend', function(e){
  const dx = e.changedTouches[0].clientX - tsx;
  const dy = e.changedTouches[0].clientY - tsy;
  if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 'R' : 'L');
  else setDir(dy > 0 ? 'D' : 'U');
}, {passive:true});

// 屏幕方向键
document.querySelectorAll('.dpad button').forEach(function(b){
  b.addEventListener('click', function(){ setDir(b.dataset.dir); });
});

$('ovBtn').onclick = function(){
  if (S.paused) togglePause();
  else start();
};
$('btnStart').onclick = start;
$('btnPause').onclick = function(){ if (!S.running && !S.dead) start(); else togglePause(); };
$('btnResign').onclick = function(){ if (S.running) die(); };
$('selDiff').onchange = function(){
  applyDiff(this.value);
  clearInterval(S.timer);
  S.running = false; S.dead = false;
  reset(false);
  start(); // 换难度直接开新局，小朋友少点一步
};

applyDiff('super');
reset(false);
draw();
</script>
</body>
</html>
