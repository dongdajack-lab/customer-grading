<div class="wrap">
  <div class="card">
    <span class="tag">已改为课堂纸质版</span>
    <h1>FABE 真人演练 · 不再线上发放</h1>
    <p>这个环节是<b>真人演练</b>：三人一组，一个当销售、一个当客户、一个当观察员。</p>
    <div class="box">
      真人演练的卡片里有<b>客户底牌</b>（真实痛点）和<b>观察员的评分标准</b>。
      放在网上，谁扫码都能看到——扮演销售的人会提前看到客户的想法，演练就变成照着答案演。
    </div>
    <p>所以这个环节改成<b>纸质角色卡</b>，课堂上按角色分发：每个场景 3 页，<b>销售页 / 客户页 / 观察员页</b>各一份，不要互相传看。</p>
    <p>要练手的话，先在手机上做<b>模拟对战</b>：客户说一句，你从四个答法里选一个，当场给你点评。</p>
    <a class="btn" href="fumaisi-workshop.html">回到练习中心 →</a>
  </div>
  <div class="foot">福麦斯销售团队共创 · 2026.09</div>
