<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大董老师天地人销售体系 · 健康度诊断</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --sky: #993C1D; --sky-bg: #FAECE7; --sky-mid: #D85A30;
    --land: #185FA5; --land-bg: #E6F1FB; --land-mid: #378ADD;
    --people: #3B6D11; --people-bg: #EAF3DE; --people-mid: #639922;
    --gray: #444441; --gray-light: #F1EFE8; --gray-mid: #888780;
    --border: rgba(0,0,0,0.1); --radius: 12px; --radius-sm: 8px;
  }
  body { font-family: "PingFang SC", "Helvetica Neue", Arial, sans-serif; background: #f7f6f2; color: #2C2C2A; font-size: 15px; line-height: 1.7; }

  /* ===== LAYOUT ===== */
  #app { max-width: 760px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
  .card { background: #fff; border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1.25rem 1.5rem; margin-bottom: 1rem; }

  /* ===== HEADER ===== */
  .hdr { text-align: center; padding: 2rem 1rem 1.5rem; }
  .hdr h1 { font-size: 22px; font-weight: 500; margin-bottom: 6px; }
  .hdr p { font-size: 14px; color: var(--gray-mid); line-height: 1.6; }
  .company-row { display: flex; gap: 12px; margin-bottom: 1.5rem; }
  .company-row input { flex: 1; padding: 10px 14px; border: 0.5px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; background: #fff; color: #2C2C2A; }
  .company-row input:focus { outline: 2px solid var(--land-mid); }

  /* ===== STEP TABS ===== */
  .step-bar { display: flex; align-items: center; gap: 0; margin-bottom: 1.5rem; }
  .step { flex: 1; text-align: center; padding: 9px 4px; font-size: 12px; font-weight: 500; cursor: pointer; border: 0.5px solid var(--border); background: #fff; color: var(--gray-mid); transition: all .2s; position: relative; }
  .step:first-child { border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
  .step:last-child { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
  .step.sky.active { background: var(--sky-bg); color: var(--sky); border-color: var(--sky-mid); }
  .step.land.active { background: var(--land-bg); color: var(--land); border-color: var(--land-mid); }
  .step.people.active { background: var(--people-bg); color: var(--people); border-color: var(--people-mid); }
  .step.result.active { background: #F1EFE8; color: var(--gray); border-color: #888; }
  .step .check { display: none; }
  .step.done .check { display: inline; margin-right: 2px; color: #639922; }

  /* ===== SECTION TITLE ===== */
  .sec-title { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
  .sec-sub { font-size: 13px; color: var(--gray-mid); margin-bottom: 1.25rem; line-height: 1.6; }

  /* ===== QUESTION ===== */
  .q-wrap { margin-bottom: 1.25rem; padding-bottom: 1.25rem; border-bottom: 0.5px solid var(--border); }
  .q-wrap:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
  .q-num { display: inline-block; width: 22px; height: 22px; border-radius: 50%; font-size: 11px; font-weight: 500; line-height: 22px; text-align: center; margin-right: 6px; }
  .q-text { font-size: 14px; line-height: 1.7; margin-bottom: 10px; }
  .score-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 0; }
  .score-btn { padding: 5px 13px; font-size: 12px; border: 0.5px solid var(--border); border-radius: 20px; cursor: pointer; background: transparent; color: var(--gray-mid); transition: all .15s; }
  .score-btn:hover { border-color: #888; color: var(--gray); }
  .score-btn.sel-1 { background: #FAECE7; border-color: #D85A30; color: #993C1D; }
  .score-btn.sel-2 { background: #FAEEDA; border-color: #BA7517; color: #854F0B; }
  .score-btn.sel-3 { background: #E6F1FB; border-color: #378ADD; color: #185FA5; }
  .score-btn.sel-4 { background: #EAF3DE; border-color: #639922; color: #3B6D11; }

  /* ===== FOLLOWUP ===== */
  .followup-box { margin-top: 10px; padding: 12px 14px; background: #FAEEDA; border-radius: var(--radius-sm); border-left: 3px solid #BA7517; animation: fadeIn .3s ease; }
  .followup-label { font-size: 11px; font-weight: 500; color: #854F0B; margin-bottom: 8px; }
  .followup-q { font-size: 13px; color: #2C2C2A; margin-bottom: 8px; line-height: 1.6; }
  .followup-opts { display: flex; flex-direction: column; gap: 5px; }
  .followup-opt { padding: 6px 12px; font-size: 12px; border: 0.5px solid #BA7517; border-radius: 6px; cursor: pointer; background: #fff; color: #854F0B; transition: all .15s; text-align: left; }
  .followup-opt.sel { background: #BA7517; color: #fff; border-color: #BA7517; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

  /* ===== PROGRESS ===== */
  .prog-wrap { margin: 1rem 0 0.4rem; }
  .prog-bar-bg { background: #F1EFE8; border-radius: 4px; height: 5px; }
  .prog-bar { height: 5px; border-radius: 4px; transition: width .4s; }
  .prog-text { font-size: 12px; color: var(--gray-mid); margin-top: 4px; }

  /* ===== BUTTONS ===== */
  .btn { display: block; width: 100%; padding: 12px; background: #fff; border: 0.5px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; cursor: pointer; text-align: center; margin-top: 1rem; color: var(--gray); transition: background .15s; }
  .btn:hover { background: #F1EFE8; }
  .btn-primary { background: #185FA5; color: #fff; border-color: #185FA5; }
  .btn-primary:hover { background: #0C447C; }

  /* ===== RESULT PAGE ===== */
  .score-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 1rem 0; }
  .score-card { background: #F1EFE8; border-radius: var(--radius-sm); padding: 0.75rem; text-align: center; }
  .score-card .lbl { font-size: 11px; color: var(--gray-mid); margin-bottom: 4px; }
  .score-card .val { font-size: 24px; font-weight: 500; }
  .radar-wrap { text-align: center; margin: 1rem 0; }
  .diag-block { border-left: 3px solid; padding: 10px 14px; margin-bottom: 10px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
  .diag-block h4 { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
  .diag-block p { font-size: 12px; color: #444; line-height: 1.7; }
  .action-list { margin-top: 6px; padding-left: 1rem; }
  .action-list li { font-size: 12px; color: #333; line-height: 1.8; }
  .insight-box { background: #F1EFE8; border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 8px; font-size: 13px; line-height: 1.7; }
  .insight-box .insight-q { color: var(--gray-mid); font-size: 11px; margin-bottom: 2px; }
  .insight-box .insight-a { color: #2C2C2A; font-weight: 500; }
  .level-badge { display: inline-block; padding: 2px 12px; border-radius: 20px; font-size: 13px; font-weight: 500; margin-left: 8px; }

  /* ===== PRINT ===== */
  @media print {
    body { background: #fff; font-size: 12px; }
    #app { padding: 0; max-width: 100%; }
    .no-print { display: none !important; }
    .card { border: 0.5px solid #ccc; page-break-inside: avoid; margin-bottom: 0.75rem; padding: 1rem; }
    .score-grid { break-inside: avoid; }
    .diag-block { break-inside: avoid; }
    .radar-wrap canvas { max-width: 280px; }
    h1 { font-size: 18px; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <div class="hdr">
    <h1>大董老师 · 天地人销售体系 · 健康度诊断</h1>
    <p>共20题 · 低分题含深度追问 · 完成后生成可打印诊断报告</p>
  </div>

  <!-- COMPANY INFO -->
  <div class="card no-print" id="company-card">
    <div class="sec-title" style="margin-bottom:0.75rem">基本信息</div>
    <div class="company-row">
      <input type="text" id="inp-company" placeholder="公司名称（可选）">
      <input type="text" id="inp-name" placeholder="填写人姓名（可选）">
    </div>
  </div>

  <!-- STEP BAR -->
  <div class="step-bar no-print">
    <div class="step sky active" onclick="switchSection('sky')"><span class="check">✓</span>天 · 战略</div>
    <div class="step land" onclick="switchSection('land')"><span class="check">✓</span>地 · 过程</div>
    <div class="step people" onclick="switchSection('people')"><span class="check">✓</span>人 · 铁军</div>
    <div class="step result" onclick="switchSection('result')"><span class="check">✓</span>诊断结果</div>
  </div>

  <!-- SECTIONS -->
  <div id="sec-sky" class="section">
    <div class="card">
      <div class="sec-title" style="color:#993C1D">天 · 排兵布阵 · 战略聚焦</div>
      <div class="sec-sub">考察企业是否在正确方向上配置资源、聚焦发力（共7题）</div>
      <div id="sky-qs"></div>
    </div>
    <div class="prog-wrap no-print">
      <div class="prog-bar-bg"><div class="prog-bar" id="sky-bar" style="width:0%;background:#D85A30"></div></div>
      <div class="prog-text" id="sky-prog-text">已完成 0 / 7 题</div>
    </div>
    <button class="btn no-print" onclick="switchSection('land')">下一步：地 · 销售过程 →</button>
  </div>

  <div id="sec-land" class="section" style="display:none">
    <div class="card">
      <div class="sec-title" style="color:#185FA5">地 · 销售过程管控</div>
      <div class="sec-sub">考察销售动作是否标准化、工具化、可复制（共7题）</div>
      <div id="land-qs"></div>
    </div>
    <div class="prog-wrap no-print">
      <div class="prog-bar-bg"><div class="prog-bar" id="land-bar" style="width:0%;background:#378ADD"></div></div>
      <div class="prog-text" id="land-prog-text">已完成 0 / 7 题</div>
    </div>
    <button class="btn no-print" onclick="switchSection('people')">下一步：人 · 铁军打造 →</button>
  </div>

  <div id="sec-people" class="section" style="display:none">
    <div class="card">
      <div class="sec-title" style="color:#3B6D11">人 · 铁军打造与激励</div>
      <div class="sec-sub">考察人才配置、能力培养与激励机制是否匹配战略（共6题）</div>
      <div id="people-qs"></div>
    </div>
    <div class="prog-wrap no-print">
      <div class="prog-bar-bg"><div class="prog-bar" id="people-bar" style="width:0%;background:#639922"></div></div>
      <div class="prog-text" id="people-prog-text">已完成 0 / 6 题</div>
    </div>
    <button class="btn btn-primary no-print" onclick="generateReport()">生成诊断报告 →</button>
  </div>

  <div id="sec-result" class="section" style="display:none">
    <div id="result-body"></div>
  </div>

</div>

<script>
// ================================================================
// 配置：Google Apps Script 部署后的网址（以 /exec 结尾）
// ★ 部署完成后，把网址粘贴到下面引号里 ★
const SCRIPT_URL = 'https://script.google.com/a/macros/s/AKfyc.../exec';

// ================================================================
// DATA: Questions + Follow-ups
// ================================================================
const QS = {
  sky: [
    {
      id:'s1', w:2,
      text:'企业是否明确定义了目标客户画像（行业/规模/地域等），并书面记录？',
      followup: {
        q:'目标客户画像缺失，主要原因是什么？',
        opts:['从来没想过要做这件事','知道要做但没时间整理','有口头共识但没书面化','不同人对目标客户理解不一致']
      }
    },
    {
      id:'s2', w:2,
      text:'是否根据客户价值（货币价值/战略价值）对客户进行了SABC分级？',
      followup: {
        q:'客户分级没落地，最大的障碍是？',
        opts:['不知道分级标准如何制定','客户数据不完整无法打分','有标准但销售不执行','分完级不知道怎么用']
      }
    },
    {
      id:'s3', w:2,
      text:'不同级别客户是否有明确差异化的服务策略和资源投入标准？',
      followup: {
        q:'差异化策略没落地，核心原因是？',
        opts:['分级本身还没完成','分了级但没有写服务策略','有策略但执行不到位','老板不同意差异化（怕得罪客户）']
      }
    },
    {
      id:'s4', w:1,
      text:'当年销售目标是否经过"五线合一（历史顺推线/未来倒推线/市场机会线/订单机会线/客户预算线）"推导，而非老板拍脑袋定？',
      followup: {
        q:'五线合一目标制定，您当前最缺失哪条线的数据或方法？',
        opts:['历史顺推线：没有过去3年分客户级别的完整销售数据','未来倒推线：没有3年销售目标愿景，不知道今年该定多少','市场机会线：不清楚市场总盘子多大，也不知道竞争对手份额','订单机会线：没有销售漏斗管理，手上机会的加权金额算不出来','客户预算线：没有调研重点客户的年度采购预算，无法做客户规划']
      }
    },
    {
      id:'s5', w:2,
      text:'销售团队是否清楚知道今年战略重点是新客拓展还是老客深挖，比例如何？',
      followup: {
        q:'战略重点不清晰，哪个描述最准确？',
        opts:['老板知道但没有向团队传达','开会说过但没有书面和配套资源','每个销售自己决定重心','说了新客，但考核还是看总业绩，没区分']
      }
    },
    {
      id:'s6', w:1,
      text:'是否有明确的市场区域/行业聚焦策略，避免全线出击、资源分散？',
      followup: {
        q:'资源分散的主要表现是？',
        opts:['什么客户都接，没有拒绝标准','区域没有规划，销售各自为战','行业聚焦不够，什么行业都做','有聚焦方向但执行层没落实']
      }
    },
    {
      id:'s7', w:1,
      text:'年度销售策略是否定期（季度/半年）复盘和调整？',
      followup: {
        q:'策略复盘没做的原因是？',
        opts:['没有固定的复盘机制','复盘了但只看业绩数字，不讨论策略','知道要做但一忙就忘了','不知道复盘策略应该看什么']
      }
    }
  ],
  land: [
    {
      id:'l1', w:2,
      text:'是否绘制了完整的销售流程图（从线索到回款），各阶段有明确定义？',
      followup: {
        q:'销售流程没有梳理，主要原因是？',
        opts:['每个客户都不一样，觉得难以标准化','有过尝试但没有坚持','认为老销售已经会了，不需要流程图','不知道如何划分流程阶段']
      }
    },
    {
      id:'l2', w:2,
      text:'销售流程各阶段是否有标准化动作清单（SOP），新员工可按图索骥？',
      followup: {
        q:'SOP缺失最直接的影响是什么？',
        opts:['新人培养周期长，半年以上才能独立','业绩严重依赖少数明星销售','赢单全靠关系和运气，方法无法总结','新人经常因为不知道该做什么而流失']
      }
    },
    {
      id:'l3', w:2,
      text:'是否针对S/A级客户和B/C级客户制定了不同的销售动作组合？',
      followup: {
        q:'不同客户动作没差异化，结果是？',
        opts:['S级客户也用简单拜访，没有深度经营','C级客户占用大量精力，ROI极低','销售不知道该如何分配时间','有差异但靠个人经验，没有制度化']
      }
    },
    {
      id:'l4', w:2,
      text:'关键动作是否配套了落地工具（拜访记录表/需求挖掘问题库/客户组织信息表/个人信息表/方案模板/竞品分析等）？',
      followup: {
        q:'工具缺失最严重的环节是哪个？',
        opts:['拜访前没有准备清单，拜访质量低','需求挖掘靠感觉，问题没有系统','方案制作全靠个人经验，水平参差不齐','谈判议价没有工具，容易被客户压价','其他（请填写）：'],
        allowOther: true
      }
    },
    {
      id:'l5', w:1,
      text:'是否有销售漏斗管理机制，能看到各阶段的客户数量和转化率？',
      followup: {
        q:'没有漏斗管理，对业绩的影响是？',
        opts:['不知道业绩缺口在哪个阶段','无法预测下个月业绩','不知道哪个销售哪个环节需要辅导','出了问题只能事后追责，无法事中干预']
      }
    },
    {
      id:'l6', w:1,
      text:'赢单/败单是否有复盘机制，并将经验提炼成可传授的方法？',
      followup: {
        q:'没有赢败单复盘，最大的损失是？',
        opts:['同样的错误反复犯，交了学费还是输','成功案例无法复制，明星销售一走就断','不知道竞争对手在哪里击败了我们','招了新人但没有可传授的打法']
      }
    },
    {
      id:'l7', w:1,
      text:'销售日常行为（拜访量/商务活动等）是否有过程数据可追踪？',
      followup: {
        q:'过程数据缺失，导致管理上最难的是？',
        opts:['不知道销售在干什么，管理全靠信任','业绩不好找不到原因，只能催单催单','无法判断销售是不努力还是能力不够','开会都是拍脑袋，没有数据支撑']
      }
    }
  ],
  people: [
    {
      id:'p1', w:2,
      text:'是否根据客户分级和销售流程，推导出了服务不同级别客户所需的销售能力模型？',
      followup: {
        q:'能力模型缺失，招人和培训的困境是？',
        opts:['招人靠感觉，面试不知道考察什么','培训没有方向，只能讲产品知识','新人不知道要提升哪些能力','优秀和普通销售的差距说不清楚']
      }
    },
    {
      id:'p2', w:2,
      text:'是否对现有销售人员做过能力盘点，并和岗位要求做过匹配度对比？',
      followup: {
        q:'没有人员盘点，当下团队最大的问题是？',
        opts:['不知道谁适合负责S级客户，全凭资历','培训没有针对性，全员上同样的课','人员调整全靠直觉和关系，没有依据','能力强弱心里有数，但无法说服当事人','知道谁是骨干，但不知道如何留住他们']
      }
    },
    {
      id:'p3', w:2,
      text:'高级客户（S/A）的负责人是否具备对应能力，而非仅靠人脉或资历分配？',
      followup: {
        q:'S/A级客户分配最接近哪种情况？',
        opts:['按入职时间/资历分配，不看能力','谁和客户关系好就谁负责','老板亲自跟进，但精力严重透支','凭感觉分配，没有明确标准']
      }
    },
    {
      id:'p4', w:1,
      text:'招聘标准是否基于能力模型，而非仅靠感觉面试或经验判断？',
      followup: {
        q:'招聘质量不稳定，最常见的问题是？',
        opts:['招来的人和预期差距大，试用期淘汰率高','面试表现好，实战能力差','容易被候选人忽悠，不知道如何甄别','没有岗位标准，每次招聘都从头摸索']
      }
    },
    {
      id:'p5', w:2,
      text:'销售激励方案（提成/奖金）是否与天（战略目标）和地（过程指标）挂钩？',

// ================================================================
// STATE
// ================================================================
const answers = {};   // {qid: score}
const followups = {}; // {qid: optIndex}
const followupCustom = {}; // {qid: customText}  for "其他" options

// ================================================================
// RENDER QUESTIONS
// ================================================================
function buildSection(sec) {
  const qs = QS[sec];
  const colors = {sky:'#993C1D',land:'#185FA5',people:'#3B6D11'};
  const container = document.getElementById(sec+'-qs');
  container.innerHTML = '';
  qs.forEach((q, i) => {
    const div = document.createElement('div');
    div.className = 'q-wrap';
    div.id = 'qwrap-'+q.id;
    div.innerHTML = `
      <div class="q-text">
        <span class="q-num" style="background:${colors[sec]}22;color:${colors[sec]}">${i+1}</span>
        ${q.text}
      </div>
      <div class="score-row" id="scores-${q.id}">
        ${['1 - 完全没有','2 - 有想法没落地','3 - 部分执行','4 - 基本完善'].map((l,idx)=>
          `<button class="score-btn" id="sbtn-${q.id}-${idx+1}" onclick="setScore('${q.id}','${sec}',${idx+1})">${l}</button>`
        ).join('')}
      </div>
      <div class="followup-box" id="fu-${q.id}" style="display:none"></div>`;
    container.appendChild(div);
  });
}

function setScore(qid, sec, val) {
  answers[qid] = val;
  for(let i=1;i<=4;i++){
    const b = document.getElementById(`sbtn-${qid}-${i}`);
    if(b) b.className = 'score-btn' + (i===val ? ` sel-${i}` : '');
  }
  // show/hide followup
  const fuBox = document.getElementById(`fu-${qid}`);
  if(val <= 2) {
    const q = findQ(qid);
    if(q && q.followup) {
      fuBox.style.display = 'block';
      const selectedOpt = followups[qid] !== undefined ? followups[qid] : -1;
      const hasOther = !!q.followup.allowOther;
      const otherIdx = hasOther ? q.followup.opts.length - 1 : -1;
      let optsHtml = q.followup.opts.map((o,idx)=> {
        if(hasOther && idx === otherIdx) {
          const label = o.replace('（请填写）：','');
          const isSel = idx === selectedOpt;
          return '<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">' +
            '<button class="followup-opt'+(isSel?' sel':'')+'" onclick="setFollowup(\''+qid+'\','+idx+')" style="flex-shrink:0">'+label+'</button>' +
            '<input type="text" id="fu-custom-inp-'+qid+'" placeholder="请填写具体情况" value="'+(followupCustom[qid]||'')+'" style="flex:1;padding:4px 8px;font-size:12px;border:0.5px solid '+(isSel?'#BA7517':'#ccc')+';border-radius:4px;'+(isSel?'':'opacity:0.4;pointer-events:none')+'" oninput="followupCustom[\''+qid+'\']=this.value">' +
            '</div>';
        }
        return '<button class="followup-opt'+(idx===selectedOpt?' sel':'')+'" onclick="setFollowup(\''+qid+'\','+idx+')" style="margin-bottom:4px;display:block">'+o+'</button>';
      }).join('');
      fuBox.innerHTML = 
        '<div class="followup-label">深度追问 · 帮我们更精准定位问题</div>' +
        '<div class="followup-q">'+q.followup.q+'</div>' +
        '<div class="followup-opts">'+optsHtml+'</div>';
    }
  } else {
    fuBox.style.display = 'none';
    delete followups[qid];
    delete followupCustom[qid];
  }
  updateProgress(sec);
}

function setFollowup(qid, idx) {
  followups[qid] = idx;
  const q = findQ(qid);
  const fuBox = document.getElementById(`fu-${qid}`);
  if(fuBox) {
    fuBox.querySelectorAll('.followup-opt').forEach((b,i)=>{
      b.classList.toggle('sel', i===idx);
    });
  }
  // Handle "其他" custom input
  if(q && q.followup && q.followup.allowOther) {
    const otherIdx = q.followup.opts.length - 1;
    const inp = document.getElementById('fu-custom-inp-'+qid);
    if(inp) {
      if(idx === otherIdx) {
        inp.style.opacity = '1';
        inp.style.pointerEvents = 'auto';
        if(followupCustom[qid]) inp.value = followupCustom[qid];
        setTimeout(()=>inp.focus(), 100);
      } else {
        inp.style.opacity = '0.4';
        inp.style.pointerEvents = 'none';
        delete followupCustom[qid];
        inp.value = '';
      }
    }
  }
}

function findQ(qid) {
  for(const sec of ['sky','land','people']) {
    const f = QS[sec].find(q=>q.id===qid);
    if(f) return f;
  }
  return null;
}

function updateProgress(sec) {
  const qs = QS[sec];
  const done = qs.filter(q=>answers[q.id]!==undefined).length;
  const pct = Math.round(done/qs.length*100);
  document.getElementById(sec+'-bar').style.width = pct+'%';
  document.getElementById(sec+'-prog-text').textContent = `已完成 ${done} / ${qs.length} 题`;
}

// ================================================================
// NAVIGATION
// ================================================================
function switchSection(name) {
  ['sky','land','people','result'].forEach(s=>{
    document.getElementById('sec-'+s).style.display = s===name?'block':'none';
  });
  const tabs = document.querySelectorAll('.step');
  const names = ['sky','land','people','result'];
  tabs.forEach((t,i)=>{
    t.classList.remove('active');
    if(names[i]===name) t.classList.add('active');
  });
  // mark done
  ['sky','land','people'].forEach(s=>{
    const allDone = QS[s].every(q=>answers[q.id]!==undefined);
    const tab = tabs[names.indexOf(s)];
    if(allDone) tab.classList.add('done');
  });
}

// ================================================================
// SCORE CALCULATION
// ================================================================
function calcSection(sec) {
  const qs = QS[sec];
  let total=0, max=0;
  qs.forEach(q=>{
    const sc = answers[q.id]||0;
    total += sc * q.w;
    max += 4 * q.w;
  });
  return max>0 ? Math.round(total/max*100) : 0;
}

function levelInfo(score) {
  if(score>=80) return {text:'优良', color:'#3B6D11', bg:'#EAF3DE'};
  if(score>=60) return {text:'待改善', color:'#185FA5', bg:'#E6F1FB'};
  if(score>=40) return {text:'薄弱', color:'#BA7517', bg:'#FAEEDA'};
  return {text:'亟需重建', color:'#993C1D', bg:'#FAECE7'};
}

// ================================================================
// DATA SUBMISSION → Google Sheets (non-blocking)
// ================================================================
function submitData() {
  if (!SCRIPT_URL || SCRIPT_URL.includes('AKfyc')) {
    // 未配置或还是占位符，跳过
    return Promise.resolve();
  }
  const payload = {
    timestamp: new Date().toLocaleString('zh-CN'),
    company: document.getElementById('inp-company').value || '',
    name: document.getElementById('inp-name').value || '',
    totalScore: Math.round((calcSection('sky')+calcSection('land')+calcSection('people'))/3),
    skyScore: calcSection('sky'),
    landScore: calcSection('land'),
    peopleScore: calcSection('people'),
    answers: {...answers},
    followups: {}
  };
  // 收集追问文本
  ['sky','land','people'].forEach(sec=>{
    QS[sec].forEach(q=>{
      const fuIdx = followups[q.id];
      if (fuIdx !== undefined && q.followup) {
        const isOther = !!(q.followup.allowOther && fuIdx === q.followup.opts.length - 1);
        if (isOther && followupCustom[q.id]) {
          payload.followups[q.id] = '其他：' + followupCustom[q.id];
        } else if (q.followup.opts[fuIdx]) {
          payload.followups[q.id] = q.followup.opts[fuIdx];
        }
      }
    });
  });
  return fetch(SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify(payload),
    headers: {'Content-Type': 'application/json'}
  }).catch(()=>{}); // 静默失败，不影响用户体验
}

function getWeakestDim(s,l,p){
  // 按因果链（天→地→人）返回最需优先改善的维度
  // 核心：天是源头，如果天没做好，地和人越改越难
  if(s < 60) return '天·战略（源头问题，先抓天）';
  if(l < 60) return '地·过程（承接天，先建流程）';
  if(p < 60) return '人·铁军（天地建好后再调人）';
  // 三维均>=60，返回最低分数的维度
  const arr=[['天·战略',s],['地·过程',l],['人·铁军',p]];
  arr.sort((a,b)=>a[1]-b[1]);
  return arr[0][0];
}

      low:{title:'人才层薄弱，需系统打造', desc:'人员分配未依据能力模型，激励与战略脱钩——团队用脚投票，向着有提成的方向而非战略方向走。注意：人出问题，未必是"人"的问题，很可能根子在天（没分级）和地（没流程）。建议先检查天/地，再做人的调整。', actions:['第一步：先确认"天"（客户分级）和"地"（销售流程）是否已建立','第二步：基于天地，推导能力模型，做一次人员能力盘点','第三步：调整激励机制，让"做对事"的人得到回报']
      },
      course:'推荐学习：大董老师《人字篇·铁军打造》（含能力模型模板+激励机制设计+培训体系搭建方法）'
    }
  ];

  // 按天→地→人因果链排序（不做分数排序，因为源头没做好后面越改越乱）
  // 但如果某一维度的上游维度分数很高（>=70），则可以考虑跳过
  const ordered = [...dims];
  let actionsHtml = '';
  let hasLow = false; // 是否有<60的维度

  ordered.forEach((d)=>{
    let content = '';
    let tagText = '';
    let tagBg = d.bg;
    let tagColor = d.color;

    if(d.score >= 75) {
      // 优良：给保持建议，可自行处理
      content = `
        <div style="background:${d.bg};border-left:3px solid ${d.color};padding:10px 14px;border-radius:0 8px 8px 0;margin-bottom:10px">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
            <span style="background:${d.levelBg};color:${d.levelColor};font-size:11px;padding:1px 8px;border-radius:10px;font-weight:500">${d.level}</span>
            <span style="font-size:13px;font-weight:500;color:${d.color}">${d.good.title}</span>
            <span style="margin-left:auto;font-size:12px;color:${d.levelColor};font-weight:500">${d.score}分</span>
          </div>
          <p style="font-size:12px;color:#444;margin-bottom:6px;line-height:1.7">${d.good.desc}</p>
          <div style="font-size:11px;color:#888;margin-bottom:6px">保持建议（您可以自行处理）：</div>
          <ul class="action-list" style="margin-top:0">
            ${d.good.actions.map(a=>`<li>${a}</li>`).join('')}
          </ul>
        </div>`;
    } else if(d.score >= 60) {
      // 待改善：给自我改进建议，可以自行处理
      content = `
        <div style="background:${d.bg};border-left:3px solid ${d.color};padding:10px 14px;border-radius:0 8px 8px 0;margin-bottom:10px">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
            <span style="background:#E6F1FB;color:#185FA5;font-size:11px;padding:1px 8px;border-radius:10px;font-weight:500">待改善</span>
            <span style="font-size:13px;font-weight:500;color:${d.color}">${d.mid.title}</span>
            <span style="margin-left:auto;font-size:12px;color:#185FA5;font-weight:500">${d.score}分</span>
          </div>
          <p style="font-size:12px;color:#444;margin-bottom:6px;line-height:1.7">${d.mid.desc}</p>
          <div style="font-size:11px;color:#888;margin-bottom:6px">自我改进建议（您可以自行处理）：</div>
          <ul class="action-list" style="margin-top:0">
            ${d.mid.actions.map(a=>`<li>${a}</li>`).join('')}
          </ul>
        </div>`;
    } else {
      // 薄弱/亟需重建：丝滑关联课程/陪跑服务
      hasLow = true;
      content = `
        <div style="background:${d.bg};border-left:3px solid ${d.color};padding:10px 14px;border-radius:0 8px 8px 0;margin-bottom:10px">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
            <span style="background:#FAECE7;color:#993C1D;font-size:11px;padding:1px 8px;border-radius:10px;font-weight:500">亟需建设</span>
            <span style="font-size:13px;font-weight:500;color:${d.color}">${d.low.title}</span>
            <span style="margin-left:auto;font-size:12px;color:#993C1D;font-weight:500">${d.score}分</span>
          </div>
          <p style="font-size:12px;color:#444;margin-bottom:6px;line-height:1.7">${d.low.desc}</p>
          <div style="font-size:11px;color:#888;margin-bottom:6px">落地建议（有条件可自学，强烈建议借助专业体系）：</div>
          <ul class="action-list" style="margin-top:0">
            ${d.low.actions.map(a=>`<li>${a}</li>`).join('')}
          </ul>
          <div style="margin-top:10px;padding:8px 12px;background:#FFF8F0;border:0.5px dashed #D85A30;border-radius:6px;font-size:12px;color:#854F0B;line-height:1.6">
            <strong>${d.course}</strong>
          </div>
        </div>`;
    }
    actionsHtml += content;
  });

  // 如果所有维度都>=75，显示一个正向总结
  if(!hasLow && dims.every(d=>d.score>=75)) {
    actionsHtml = '<div style="color:#3B6D11;font-size:14px;text-align:center;padding:1.5rem;background:#EAF3DE;border-radius:8px;margin-bottom:1rem"><strong>恭喜！</strong>您的销售体系三个维度均表现优良。建议持续优化细节，定期做健康度复盘。</div>' + actionsHtml;
  }

  // 如果天<60但地或人<60，需要在前面加因果链提醒
  if(skyS < 60 && (landS < 60 || peopleS < 60)) {
    const introHtml = `
      <div style="background:#FAECE7;border:1px solid #D85A30;border-radius:8px;padding:12px 14px;margin-bottom:1rem;font-size:13px;color:#854F0B;line-height:1.7">
        <strong>⚠️ 重要提醒：优先级的正确顺序是天→地→人</strong><br>
        您当前的诊断显示"天"（${skyS}分）和${landS<60?'"地"（'+landS+'分）':''}${peopleS<60?'"人"（'+peopleS+'分）':''}都偏弱。<br>
        <strong>建议优先从"天"开始建设</strong>——客户分级没做，销售流程就没有方向；流程没标准化，人才培养就没有标准。直接做"人"的调整，容易治标不治本。
      </div>`;
    actionsHtml = introHtml + actionsHtml;
  }

  // Build insights from followups
  let insightsHtml = '';
  for(const sec of ['sky','land','people']){
    QS[sec].forEach(q=>{
      const score = answers[q.id]||0;
      const fuIdx = followups[q.id];
      if(score<=2 && fuIdx!==undefined && q.followup){
        const chosenOpt = q.followup.opts[fuIdx];
        const isOther = !!(q.followup.allowOther && fuIdx === q.followup.opts.length - 1);
        const displayReason = isOther && followupCustom[q.id] ? '其他：' + followupCustom[q.id] : chosenOpt;
        const advice = getFollowupAdvice(q.id, fuIdx);
        insightsHtml += `
          <div class="insight-box" style="margin-bottom:8px">
            <div class="insight-q">问题：${q.text}</div>
            <div class="insight-a">根因：${displayReason}</div>
            ${advice ? `<div style="font-size:12px;color:#555;margin-top:4px;line-height:1.7;border-top:0.5px solid rgba(0,0,0,0.08);padding-top:6px">${advice}</div>` : ''}
          </div>`;
      }
    });
  }

  return {actions: actionsHtml, insights: insightsHtml};
}

function buildScoreDetail(skyS,landS,peopleS){
  const secInfo = {
    sky:{label:'天 · 战略聚焦', color:'#993C1D', bg:'#FAECE7', score:skyS},
    land:{label:'地 · 过程管控', color:'#185FA5', bg:'#E6F1FB', score:landS},
    people:{label:'人 · 铁军激励', color:'#3B6D11', bg:'#EAF3DE', score:peopleS}
  };
  let html = '';
  for(const sec of ['sky','land','people']){
    const info = secInfo[sec];
    html += `<div style="margin-bottom:1rem">
      <div style="font-size:13px;font-weight:500;color:${info.color};margin-bottom:6px;padding:4px 10px;background:${info.bg};border-radius:6px;display:inline-block">${info.label}  ${info.score}分</div>
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead><tr style="background:#F7F6F2">
          <th style="padding:5px 8px;text-align:left;font-weight:500;border:0.5px solid #e0ded8;width:60%">诊断题目</th>
          <th style="padding:5px 8px;text-align:center;font-weight:500;border:0.5px solid #e0ded8;width:15%">得分</th>
          <th style="padding:5px 8px;text-align:left;font-weight:500;border:0.5px solid #e0ded8;width:25%">状态</th>
        </tr></thead>
        <tbody>`;
    QS[sec].forEach((q,i)=>{
      const sc = answers[q.id]||0;
      const statusMap = {0:'未作答',1:'完全没有',2:'有想法没落地',3:'部分执行',4:'基本完善'};
      const colorMap = {0:'#aaa',1:'#D85A30',2:'#BA7517',3:'#378ADD',4:'#639922'};
      const fuIdx = followups[q.id];
      const fuText = sc<=2 && fuIdx!==undefined && q.followup ? (()=>{
        const isOther = !!(q.followup.allowOther && fuIdx===q.followup.opts.length-1);
        const display = isOther && followupCustom[q.id] ? '其他：'+followupCustom[q.id] : q.followup.opts[fuIdx];
        return '<br><span style="color:#888;font-style:italic">&#8614; '+display+'</span>';
      })() : '';
      html += `<tr>
        <td style="padding:6px 8px;border:0.5px solid #e0ded8;line-height:1.6">${q.text}${fuText}</td>
        <td style="padding:6px 8px;border:0.5px solid #e0ded8;text-align:center;font-weight:500;color:${colorMap[sc]}">${sc||'-'}</td>
        <td style="padding:6px 8px;border:0.5px solid #e0ded8;color:${colorMap[sc]}">${statusMap[sc]}</td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  }
  return html;
}

function resetAll(){
  Object.keys(answers).forEach(k=>delete answers[k]);
  Object.keys(followups).forEach(k=>delete followups[k]);
  Object.keys(followupCustom).forEach(k=>delete followupCustom[k]);
  buildSection('sky'); buildSection('land'); buildSection('people');
  updateProgress('sky'); updateProgress('land'); updateProgress('people');
  document.getElementById('result-body').innerHTML='';
  switchSection('sky');
}

buildSection('land');
