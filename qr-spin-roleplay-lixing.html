<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPIN演练-讲师版 · 二维码</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #B85042 0%, #2F3C7E 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .icon { font-size: 60px; margin-bottom: 20px; }
        h1 {
            color: #2F3C7E;
            font-size: 24px;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .qr-wrapper {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            display: inline-block;
            margin-bottom: 20px;
            border: 2px dashed #B85042;
        }
        img {
            width: 300px;
            height: 300px;
            display: block;
        }
        .url {
            background: #f0f0f0;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 12px;
            color: #666;
            word-break: break-all;
            margin-top: 20px;
            font-family: monospace;
        }
        .tip {
            margin-top: 15px;
            font-size: 13px;
            color: #B85042;
            font-weight: 500;
        }
        .print-btn {
            margin-top: 20px;
            padding: 10px 30px;
            background: #B85042;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .print-btn:hover { background: #a04337; }
        .features {
            margin-top: 25px;
            text-align: left;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
        }
        .features h3 {
            color: #2F3C7E;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .features li {
            margin: 8px 0;
            font-size: 13px;
            color: #444;
        }
        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; }
            .print-btn { display: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🎓</div>
        <h1>SPIN演练工具 · 讲师版</h1>
        <p class="subtitle">利兴纺织 · 维珍妮场景 · 课堂控场</p>
        
        <div class="qr-wrapper">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://dongdajack-lab.github.io/customer-grading/spin-roleplay-lixing.html" alt="SPIN演练讲师版二维码" />
        </div>
        
        <div class="url">https://dongdajack-lab.github.io/customer-grading/spin-roleplay-lixing.html</div>
        
        <div class="features">
            <h3>📋 讲师版功能</h3>
            <ul>
                <li>✅ <strong>场景总览</strong> - 时间/地点/人物/背景</li>
                <li>✅ <strong>角色卡</strong> - 销售卡+客户卡（含隐藏想法）</li>
                <li>✅ <strong>SPIN提示</strong> - S/P/I/N各阶段示例问句</li>
                <li>✅ <strong>评分表</strong> - 6维度打分+自动计算</li>
                <li>✅ <strong>讲师话术</strong> - 开场/分组/点评逐字稿</li>
                <li>✅ <strong>可打印</strong> - 每个Tab可单独打印</li>
            </ul>
        </div>
        
        <button class="print-btn" onclick="window.print()">🖨️ 打印二维码</button>
        <p class="tip">📱 手机扫码即可在课堂使用</p>
    </div>
</body>
</html>
