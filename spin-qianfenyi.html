<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大董老师 · 挖痛练习 - 千分一智能定制版</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#f5f6fa;min-height:100vh}
  header{background:linear-gradient(135deg,#283593,#EF6C00);color:white;padding:24px 32px;text-align:center}
  header h1{font-size:26px}
  header .subtitle{font-size:14px;opacity:.85;margin-top:6px}
  header .company-tag{display:inline-block;background:rgba(255,255,255,.2);border-radius:20px;padding:3px 14px;font-size:13px;margin-top:8px}
  header .custom-tag{display:inline-block;background:#F39C12;border-radius:20px;padding:3px 14px;font-size:13px;margin-top:8px;margin-left:8px;font-weight:700;color:#fff}
  .container{max-width:800px;margin:0 auto;padding:32px 20px}
  .progress-bar{height:6px;background:#ddd;border-radius:3px;margin-bottom:24px;overflow:hidden}
  .progress-fill{height:100%;background:#EF6C00;border-radius:3px;transition:width .4s}
  .progress-text{text-align:right;font-size:13px;color:#888;margin-bottom:4px}
  .spin-hint{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .spin-tag{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600}
  .tag-S{background:#EBF5FB;color:#2980B9}
  .tag-P{background:#FDEDEC;color:#E67E22}
  .tag-I{background:#FADBD8;color:#C0392B}
  .tag-N{background:#E8F8F5;color:#27AE60}
  .card{background:white;border-radius:16px;padding:32px;box-shadow:0 2px 16px rgba(0,0,0,.08)}
  .question-badge{display:inline-block;background:#EF6C00;color:white;border-radius:20px;padding:4px 14px;font-size:13px;margin-bottom:16px}
  .scenario{background:#f8f9fa;border-left:4px solid #EF6C00;padding:16px 20px;border-radius:0 12px 12px 0;margin:16px 0;font-size:15px;line-height:1.8;color:#333}
  .scenario .label{font-weight:600;color:#283593}
  .options{display:flex;flex-direction:column;gap:12px;margin-top:20px}
  .option{display:flex;align-items:flex-start;gap:14px;padding:16px 20px;border:2px solid #e0e0e0;border-radius:12px;cursor:pointer;transition:all .2s;font-size:15px;line-height:1.6}
  .option:hover{border-color:#EF6C00;background:#E8F6F3}
  .option.selected{border-color:#EF6C00;background:#E8F6F3}
  .option.correct{border-color:#27AE60;background:#E8F8F5}
  .option.wrong{border-color:#E74C3C;background:#FDEDEC}
  .option .radio{min-width:22px;height:22px;border-radius:50%;border:2px solid #ccc;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;margin-top:1px}
  .option.selected .radio{border-color:#EF6C00;background:#EF6C00}
  .option.selected .radio::after{content:'';width:8px;height:8px;background:white;border-radius:50%;display:block}
  .option .text{flex:1}
  .explanation{margin-top:20px;padding:16px 20px;background:#E8F8F5;border-radius:12px;display:none}
  .explanation.show{display:block}
  .explanation h4{color:#27AE60;font-size:15px;margin-bottom:8px}
  .explanation p{font-size:14px;color:#333;line-height:1.7}
  .correct-answer{margin-top:20px;padding:14px 18px;background:#FFF3CD;border:2px solid #F0AD4E;border-radius:12px;display:none;font-size:14px;line-height:1.6}
  .correct-answer.show{display:block}
  .correct-answer .clabel{font-weight:700;color:#E67E22;margin-bottom:6px}
  .opt-label{font-weight:700;color:#283593;margin-right:6px}
  .btn-row{display:flex;gap:12px;margin-top:24px}
  .btn{flex:1;padding:14px;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s}
  .btn-primary{background:#EF6C00;color:white}
  .btn-primary:hover{background:#0e6b5c}
  .btn-primary:disabled{background:#ccc;cursor:not-allowed}
  .btn-secondary{background:#f0f0f0;color:#333}
  .btn-secondary:hover{background:#e0e0e0}
  .result-page{display:none}
  .result-page.show{display:block;text-align:center}
  .score-circle{width:160px;height:160px;border-radius:50%;background:linear-gradient(135deg,#283593,#EF6C00);color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 24px}
  .score-circle .num{font-size:48px;font-weight:700;line-height:1}
  .score-circle .slabel{font-size:14px;margin-top:4px;opacity:.85}
  .percent-circle{display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 24px}
  .percent-circle .num{font-size:36px;font-weight:700;color:#EF6C00;line-height:1}
  .percent-circle .unit{font-size:20px;font-weight:700;color:#EF6C00}
  .percent-circle .sub-label{font-size:13px;color:#999;margin-top:2px}
  .result-detail{background:white;border-radius:16px;padding:24px;margin-top:20px;text-align:left}
  .result-detail h3{font-size:17px;margin-bottom:12px;color:#333}
  .result-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f0f0;font-size:14px}
  .result-item:last-child{border-bottom:none}
  .restart-btn{margin-top:24px;padding:14px 48px;background:#EF6C00;color:white;border:none;border-radius:10px;font-size:16px;cursor:pointer}
</style>
</head>
<body>

<header>
  <h1>大董老师 · 挖痛练习</h1>
  <p class="subtitle">SPIN四层提问法训练 · 共16题</p>
  <span class="company-tag">✏️ 千分一智能 · 智能笔与传感器</span>
  <span class="custom-tag">★ 定制开发</span>
</header>

<div class="container">
  <div id="quizPage">
    <div class="progress-text" id="progressText"></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="spin-hint">
      <span class="spin-tag tag-S">S 现状问题</span>
      <span class="spin-tag tag-P">P 难点问题</span>
      <span class="spin-tag tag-I">I 影响问题</span>
      <span class="spin-tag tag-N">N 需求回报</span>
    </div>
    <div class="card" id="questionCard"></div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="btnPrev" disabled>上一题</button>
      <button class="btn btn-primary" id="btnNext" disabled>确认答案</button>
    </div>
  </div>

  <div class="result-page" id="resultPage">
    <div class="score-circle">
      <span class="num" id="scoreNum">0</span>
      <span class="slabel">正确 / 16 题</span>
    </div>
    <div class="percent-circle">
      <span class="num" id="percentNum">0</span>
      <span class="unit">分</span>
      <span class="sub-label">百分制</span>
    </div>
    <div class="result-detail" id="resultDetail"></div>
    <button class="restart-btn" id="restartBtn">再来一次</button>
  </div>
</div>

<script>
(function(){

  var currentQ = 0;
  var answers = [];
  var answered = false;

  function renderQ() {
    var q = questions[currentQ];
    document.getElementById('progressText').textContent = '第 ' + (currentQ+1) + ' / ' + questions.length + ' 题';
    document.getElementById('progressFill').style.width = ((currentQ+1)/questions.length*100) + '%';

    var badge = q.scenario.indexOf('S -')>=0 ? 'S 现状问题' : q.scenario.indexOf('P -')>=0 ? 'P 难点问题' : q.scenario.indexOf('I -')>=0 ? 'I 影响问题' : 'N 需求回报';
    var card = document.getElementById('questionCard');
    card.innerHTML = '<div class="question-badge">' + badge + '</div>' +
      '<div class="scenario"><span class="label">📋 场景：</span><br>' + q.scenario + '</div>' +
      '<div style="font-size:16px;font-weight:600;color:#333;margin-bottom:16px;">' + q.question + '</div>' +
      '<div class="options">' +
      q.options.map(function(opt,i){
        return '<div class="option" onclick="selectOpt(' + i + ')">' +
          '<div class="radio"></div>' +
          '<div class="text">' + opt.text + '</div>' +
        '</div>';
      }).join('') +
      '</div>' +
      '<div class="explanation" id="explanation">' +
        '<h4>✅ 解析</h4>' +
        '<p>' + q.explain + '</p>' +
      '</div>' +
      '<div class="correct-answer" id="correctAnswer">' +
        '<div class="clabel">💡 正确答案解析：</div>' +
        '<div>' + q.explain + '</div>' +
      '</div>';

    answered = false;
    document.getElementById('btnNext').textContent = '确认答案';
    document.getElementById('btnNext').disabled = true;
    document.getElementById('btnNext').onclick = checkAnswer;
    document.getElementById('btnPrev').disabled = currentQ === 0;
    document.getElementById('resultPage').classList.remove('show');
    document.getElementById('quizPage').style.display = '';
  }

  window.selectOpt = function(idx) {
    if (answered) return;
    var opts = document.querySelectorAll('.option');
    opts.forEach(function(opt,i){ opt.classList.toggle('selected', i===idx); });
    window.selectedIdx = idx;
    document.getElementById('btnNext').disabled = false;
  };

  window.checkAnswer = function() {
    if (window.selectedIdx === undefined) return;
    answered = true;
    var q = questions[currentQ];
    var opts = document.querySelectorAll('.option');
    opts.forEach(function(opt,i){
      if (q.options[i].correct) opt.classList.add('correct');
      if (i === window.selectedIdx && !q.options[i].correct) opt.classList.add('wrong');
    });
    answers[currentQ] = q.options[window.selectedIdx].correct;
    document.getElementById('explanation').classList.add('show');
    document.getElementById('correctAnswer').classList.add('show');
    document.getElementById('btnNext').textContent = currentQ < questions.length-1 ? '下一题 →' : '查看结果';
    document.getElementById('btnNext').onclick = nextQ;
    document.getElementById('btnNext').disabled = false;
  };

  window.nextQ = function() {
    if (currentQ < questions.length-1) {
      currentQ++;
      renderQ();
    } else {
      showResult();
    }
  };

  window.prevQ = function() {
    if (currentQ > 0) {
      currentQ--;
      renderQ();
      if (answers[currentQ] !== undefined) {
        answered = true;
        var q = questions[currentQ];
        var opts = document.querySelectorAll('.option');
        opts.forEach(function(opt,i){
          if (q.options[i].correct) opt.classList.add('correct');
          if (answers[currentQ] === false && i === window.selectedIdx) opt.classList.add('wrong');
        });
        document.getElementById('explanation').classList.add('show');
        document.getElementById('correctAnswer').classList.add('show');
        document.getElementById('btnNext').textContent = currentQ < questions.length-1 ? '下一题 →' : '查看结果';
        document.getElementById('btnNext').onclick = nextQ;
      }
    }
  };

  function showResult() {
    document.getElementById('quizPage').style.display = 'none';
    var score = answers.filter(function(a){return a;}).length;
    var percent = Math.round(score / questions.length * 100);
    document.getElementById('scoreNum').textContent = score;
    document.getElementById('percentNum').textContent = percent;

    var detail = '<h3>📊 答题详情</h3>';
    questions.forEach(function(q,i){
      var icon = answers[i] ? '✅' : '❌';
      var title = q.scenario.substring(0, 40) + '...';
      detail += '<div class="result-item"><span style="font-size:18px;">' + icon + '</span><span>第' + (i+1) + '题：' + title + '</span></div>';
    });
    document.getElementById('resultDetail').innerHTML = detail;
    document.getElementById('resultPage').classList.add('show');
  }

  document.getElementById('restartBtn').onclick = function() {
    currentQ = 0;
    answers = [];
    window.selectedIdx = undefined;
    answered = false;
    renderQ();
  };

  document.getElementById('btnPrev').onclick = prevQ;

  renderQ();
})();
</script>
