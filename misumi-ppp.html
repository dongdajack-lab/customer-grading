<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPP破冰练习 - 米思米电话沟通实战</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif; background:#f0f4f8; min-height:100vh; }

  header { background:linear-gradient(135deg,#1A365D,#2B6CB0); color:white; padding:22px 28px; text-align:center; }
  header .logo { font-size:13px; letter-spacing:2px; opacity:0.7; margin-bottom:4px; }
  header h1 { font-size:24px; letter-spacing:1px; }
  header p { font-size:13px; opacity:0.75; margin-top:5px; }

  .container { max-width:780px; margin:0 auto; padding:24px 16px 40px; }

  /* Progress */
  .progress-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .progress-label { font-size:12px; color:#888; }
  .progress-bar { height:5px; background:#dde3ea; border-radius:3px; overflow:hidden; margin-bottom:20px; }
  .progress-fill { height:100%; background:linear-gradient(90deg,#1A365D,#2B6CB0); border-radius:3px; transition:width 0.5s ease; }

  /* Cards */
  .card { background:white; border-radius:16px; padding:26px 22px; box-shadow:0 2px 12px rgba(0,0,0,0.07); margin-bottom:16px; }

  /* Question */
  .q-badge { display:inline-block; background:#1A365D; color:white; border-radius:20px; padding:3px 12px; font-size:12px; margin-bottom:14px; font-weight:600; }
  .q-type { display:inline-block; background:#E8F4FD; color:#1A365D; border-radius:20px; padding:3px 10px; font-size:11px; margin-left:8px; }
  .q-text { font-size:15px; line-height:1.75; color:#222; margin-bottom:14px; }

  /* Scenario box */
  .scenario { background:#f8fafc; border-left:4px solid #2B6CB0; padding:12px 16px; border-radius:0 10px 10px 0; margin-bottom:16px; font-size:14px; line-height:1.7; color:#334155; }
  .scenario .role-tag { display:inline-block; background:#2B6CB0; color:white; border-radius:12px; padding:2px 10px; font-size:11px; font-weight:600; margin-bottom:6px; }

  /* PPP hint tags */
  .hint-row { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
  .hint-tag { padding:4px 11px; border-radius:14px; font-size:12px; font-weight:700; }
  .tag-P { background:#EBF5FB; color:#1A365D; }
  .tag-Pu { background:#E8F4FD; color:#1A365D; }
  .tag-Pr { background:#D6EAF8; color:#1A365D; }
  .tag-Pa { background:#AED6F1; color:#1A365D; }

  /* Options */
  .options { display:flex; flex-direction:column; gap:10px; }
  .option { display:flex; align-items:flex-start; gap:12px; padding:14px 16px; border:2px solid #e2e8f0; border-radius:12px; cursor:pointer; transition:all 0.2s; font-size:14px; line-height:1.65; color:#374151; }
  .option:hover { border-color:#2B6CB0; background:#f0f7ff; }
  .option.selected { border-color:#2B6CB0; background:#EBF5FB; }
  .option.correct { border-color:#27AE60; background:#E8F8F5; }
  .option.wrong { border-color:#E74C3C; background:#FDEDEC; }
  .opt-letter { min-width:24px; height:24px; border-radius:50%; border:2px solid #cbd5e0; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:#888; flex-shrink:0; margin-top:1px; transition:all 0.2s; }
  .option.selected .opt-letter { border-color:#2B6CB0; background:#2B6CB0; color:white; }
  .option.correct .opt-letter { border-color:#27AE60; background:#27AE60; color:white; }
  .option.wrong .opt-letter { border-color:#E74C3C; background:#E74C3C; color:white; }
  .option .opt-text { flex:1; }

  /* Explanation */
  .explanation { margin-top:16px; padding:14px 16px; border-radius:12px; display:none; font-size:14px; line-height:1.7; }
  .explanation.show { display:block; }
  .explanation .exp-title { font-weight:700; font-size:14px; margin-bottom:6px; display:flex; align-items:center; gap:6px; }
  .explanation .exp-title .icon { font-size:16px; }
  .explanation p { color:#334155; }
  .exp-correct { background:#E8F8F5; border-left:4px solid #27AE60; }
  .exp-correct .exp-title { color:#27AE60; }
  .exp-wrong { background:#FFF8f0; border-left:4px solid #E67E22; }
  .exp-wrong .exp-title { color:#E67E22; }

  /* PPP Detail */
  .ppp-detail { margin-top:10px; background:#f0f7ff; border-radius:10px; padding:10px 14px; }
  .ppp-row { display:flex; gap:8px; margin-bottom:6px; flex-wrap:wrap; }
  .ppp-tag { padding:3px 10px; border-radius:10px; font-size:12px; font-weight:600; }
  .ppp-tag.p { background:#EBF5FB; color:#1A365D; }
  .ppp-tag.missing { background:#FDEDEC; color:#C0392B; }
  .ppp-tag.ok { background:#E8F8F5; color:#27AE60; }

  /* Buttons */
  .btn-row { display:flex; gap:10px; margin-top:20px; }
  .btn { flex:1; padding:13px; border:none; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; transition:all 0.2s; }
  .btn-primary { background:#1A365D; color:white; }
  .btn-primary:hover { background:#2B6CB0; }
  .btn-primary:disabled { background:#94a3b8; cursor:not-allowed; }
  .btn-outline { background:white; color:#1A365D; border:2px solid #1A365D; }
  .btn-outline:hover { background:#f0f7ff; }

  /* Result screen */
  .result-screen { display:none; text-align:center; padding:20px 10px; }
  .result-screen.show { display:block; }
  .score-circle { width:120px; height:120px; border-radius:50%; margin:0 auto 20px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:36px; font-weight:800; color:white; }
  .score-ring { background:conic-gradient(#2ECC71 var(--pct,0%), #e2e8f0 0%); border-radius:50%; width:120px; height:120px; display:flex; align-items:center; justify-content:center; margin:0 auto 20px; }
  .score-inner { width:96px; height:96px; background:white; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .score-num { font-size:32px; font-weight:800; color:#1A365D; line-height:1; }
  .score-total { font-size:14px; color:#888; }
  .result-title { font-size:22px; font-weight:700; color:#1A365D; margin-bottom:8px; }
  .result-sub { font-size:14px; color:#64748b; margin-bottom:24px; line-height:1.6; }

  /* Stats row */
  .stats-row { display:flex; gap:12px; justify-content:center; margin-bottom:24px; flex-wrap:wrap; }
  .stat-card { background:white; border-radius:12px; padding:14px 20px; text-align:center; min-width:80px; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
  .stat-num { font-size:24px; font-weight:800; }
  .stat-label { font-size:12px; color:#888; margin-top:2px; }
  .stat-card.green .stat-num { color:#27AE60; }
  .stat-card.red .stat-num { color:#E74C3C; }
  .stat-card.blue .stat-num { color:#2B6CB0; }

  /* Review list */
  .review-title { text-align:left; font-size:16px; font-weight:700; color:#1A365D; margin-bottom:14px; padding-bottom:10px; border-bottom:2px solid #e2e8f0; }
  .review-item { background:white; border-radius:12px; padding:16px; margin-bottom:12px; text-align:left; border-left:4px solid #e2e8f0; }
  .review-item.right { border-left-color:#27AE60; }
  .review-item.wrong { border-left-color:#E74C3C; }
  .review-q { font-size:13px; font-weight:600; color:#475569; margin-bottom:6px; }
  .review-answer { font-size:13px; color:#1A365D; margin-bottom:4px; }
  .review-exp { font-size:12px; color:#64748b; line-height:1.6; margin-top:6px; background:#f8fafc; padding:8px 10px; border-radius:8px; }

  /* Start screen */
  .start-screen { display:block; }
  .intro-card { background:white; border-radius:16px; padding:28px 24px; text-align:center; box-shadow:0 2px 12px rgba(0,0,0,0.07); margin-bottom:16px; }
  .intro-card h2 { font-size:20px; color:#1A365D; margin-bottom:10px; }
  .intro-card p { font-size:14px; color:#64748b; line-height:1.7; margin-bottom:16px; }
  .model-intro { display:flex; justify-content:center; gap:16px; margin:16px 0; flex-wrap:wrap; }
  .model-chip { padding:8px 16px; border-radius:20px; font-size:13px; font-weight:700; }
  .chip-p { background:#EBF5FB; color:#1A365D; }
  .chip-pp { background:#D6EAF8; color:#1A365D; }
  .chip-ppp { background:#AED6F1; color:#1A365D; }
  .covers { font-size:12px; color:#888; margin-top:12px; }
  .covers span { background:#f1f5f9; padding:2px 8px; border-radius:8px; margin:2px; display:inline-block; }

  /* Hide quiz during start */
  .quiz-content { display:none; }
  .quiz-content.active { display:block; }
  .start-screen { display:block; }
  .start-screen.hidden { display:none; }

  .back-btn { display:inline-flex; align-items:center; gap:6px; color:#64748b; font-size:13px; cursor:pointer; margin-bottom:16px; padding:6px 0; }
  .back-btn:hover { color:#1A365D; }
</style>
</head>
<body>

<header>
  <div class="logo">MISUMI · 中心营业培训</div>
  <h1>PPP破冰练习</h1>
  <p>从"怕开口"到"敢开口" — 电话沟通实战</p>
</header>

<div class="container">

  <!-- Start Screen -->
  <div class="start-screen" id="startScreen">
    <div class="intro-card">
      <h2>📞 PPP破冰模型</h2>
      <p>PPP = Purpose（目的）+ Process（过程）+ Payoff（收益）<br>三个要素缺一不可，才能让客户前15秒不挂电话</p>
      <div class="model-intro">
        <span class="model-chip chip-p">Purpose<br>目的</span>
        <span class="model-chip chip-pp">Process<br>过程</span>
        <span class="model-chip chip-ppp">Payoff<br>收益</span>
      </div>
      <p style="font-size:13px; color:#64748b; line-height:1.7;">
        本练习包含10道题，涵盖：<br>
        · 哪个P缺失的识别<br>
        · 完整话术选择<br>
        · 底层逻辑判断
      </p>
      <div class="covers">
        适用场景：<span>内勤电话</span><span>中心营业电话</span><span>微信开场</span><span>邮件主题</span>
      </div>
      <button class="btn btn-primary" style="margin-top:16px; width:100%;" onclick="startQuiz()">开始练习 →</button>
    </div>
  </div>

  <!-- Quiz Content -->
  <div class="quiz-content" id="quizContent">
    <div class="progress-top">
      <span class="progress-label" id="progressLabel">第 1 / 10 题</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:10%"></div></div>

    <div class="card" id="questionCard">
      <span class="q-badge" id="qBadge">第 1 题</span>
      <span class="q-type" id="qType" style="display:none"></span>
      <div class="q-text" id="qText"></div>
      <div class="scenario" id="scenarioBox" style="display:none">
        <div class="role-tag" id="roleTag"></div>
        <div id="scenarioText"></div>
      </div>
      <div class="hint-row" id="hintRow" style="display:none"></div>
      <div class="options" id="optionsContainer"></div>
      <div class="explanation" id="explanation"></div>
      <div class="btn-row">
        <button class="btn btn-primary" id="submitBtn" disabled onclick="submitAnswer()">确认答案</button>
        <button class="btn btn-outline" id="nextBtn" style="display:none" onclick="nextQuestion()">下一题 →</button>
      </div>
    </div>
  </div>

  <!-- Result Screen -->
  <div class="result-screen" id="resultScreen">
    <div class="score-ring" id="scoreRing" style="--pct:0%">
      <div class="score-inner">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-total">/ 10</div>
      </div>
    </div>
    <div class="result-title" id="resultTitle"></div>
    <div class="result-sub" id="resultSub"></div>

    <div class="stats-row">
      <div class="stat-card green"><div class="stat-num" id="statRight">0</div><div class="stat-label">答对</div></div>
      <div class="stat-card red"><div class="stat-num" id="statWrong">0</div><div class="stat-label">答错</div></div>
      <div class="stat-card blue"><div class="stat-num" id="statScore">0%</div><div class="stat-label">正确率</div></div>
    </div>

    <div class="review-title" id="reviewTitle">📋 答题回顾</div>
    <div id="reviewList"></div>

    <button class="btn btn-primary" style="margin-top:20px; width:100%;" onclick="restartQuiz()">🔄 再练一次</button>
  </div>

</div>

<script>
const questions = [
  {
    type: "场景选择",
    scenario: { role: "内勤 · 电话开场", text: "给一位3天前提交过询价的采购经理打第一通电话，对方没有主动回复。" },
    text: "以下哪句开场白同时具备“目的+过程+收益”三个要素？",
    options: [
      "您好，我是米思米的，想问一下您收到我们的报价了吗？",
      "张经理您好，今天占用您3分钟，介绍2款近期降价的导轨型号，听完您判断是否值得了解。",
      "您好米思米给您报价的，您这边考虑得怎么样了？",
      "您好，米思米销售，今天给您打电话是因为有款产品在做活动，价格很优惠。"
    ],
    correct: 1,
    explanation: "选项B完整包含三个P：<br>✅ <strong>Purpose（目的）</strong>：介绍2款近期降价的导轨型号<br>✅ <strong>Process（过程）</strong>：只需3分钟<br>✅ <strong>Payoff（收益）</strong>：听完您判断是否值得<br><br>选项A缺少Process（要多久）和Payoff（对你有什么好处）；<br>选项C有追问感但缺少三个P；<br>选项D缺少具体时间承诺和收益描述。"
  },
  {
    type: "缺P识别",
    text: "以下是一名内勤的原始话术：<br><em>「您好，我看到您浏览了我们的网站，我们是米思米的。」</em><br>这句话缺少了PPP中的哪些要素？",
    options: [
      "缺少Purpose（目的）和Process（过程）",
      "缺少Process（过程）和Payoff（收益）",
      "缺少Purpose（目的）和Payoff（收益）",
      "缺少Purpose（目的）、Process（过程）和Payoff（收益）"
    ],
    correct: 3,
    explanation: "这句话只告知了身份（我们是米思米的），但<strong>三个P都没有体现</strong>：<br>❌ <strong>没有说明目的</strong>（为什么要联系对方）<br>❌ <strong>没有说明过程</strong>（要占用多少时间）<br>❌ <strong>没有说明对客户的好处</strong>（凭什么让对方听下去）<br><br>改进方案：「张经理您好，我是米思米的，<strong>想分享近期导轨降价信息</strong>（Purpose），<strong>只需2分钟</strong>（Process），<strong>听完您判断是否值得参考</strong>（Payoff）。」"
  },
  {
    type: "底层逻辑",
    text: "PPP模型消除的客户防御心，对应的是三个核心问题。请问：<br>Process（过程）消除的是客户的哪种顾虑？",
    options: [
      "“你要干什么？”——目的不明的顾虑",
      "“要多久？”——时间成本的顾虑",
      "“对我有什么好处？”——收益不确定的顾虑",
      "“你是谁？”——身份信任的顾虑"
    ],
    correct: 1,
    explanation: "<strong>Process（过程）</strong>解决的是<strong>「要多久？」</strong>这个问题。<br><br>客户在接电话时心里有个问题：这个人要占用我多少时间？<br>通过明确说明「只需X分钟」，把不确定变成确定，降低客户的心理抵触。<br><br>完整对应关系：<br>Purpose → 「你要干什么？」<br>Process → 「要多久？」<br>Payoff → 「对我有什么好处？」"
  },
  {
    type: "话术判断",
    text: "中心营业小张需要给客户发微信好友申请。以下哪条申请消息最符合PPP原则？",
    options: [
      "您好，我是米思米销售小张，请问可以加个好友吗？",
      "您好，米思米中心营业小张，最近导轨价格有调整，方便通过一下吗？",
      "您好，我是米思米的，有款性价比很高的产品想推荐给您，方便加个微信聊聊吗？",
      "张总您好，我是米思米中心营业小张，近期导轨/丝杠/模组三个品类价格下调15%-25%，想分享一份整理好的降价清单给您，方便通过好友申请吗？"
    ],
    correct: 3,
    explanation: "选项D最完整：<br>✅ <strong>Purpose（目的）</strong>：分享一份整理好的降价清单<br>✅ <strong>Process（过程）</strong>：加微信（极低门槛）<br>✅ <strong>Payoff（收益）</strong>：具体品类降价15%-25%，数字清晰<br><br>选项A缺少三个P；选项B缺少具体价值描述；选项C过于泛泛（「性价比很高」没有具体数字）。"
  },
  {
    type: "场景选择",
    scenario: { role: "内勤 · 电话追单", text: "一位客户已经收到报价单7天了一直没有下单，你需要打电话跟进。" },
    text: "以下哪句追单开场白同时包含了三个P？",
    options: [
      "您好张总，我是米思米小王，想问一下上次发的报价考虑得怎么样了？",
      "张经理您好，今天占用您2分钟，重点跟您确认报价单里2个型号的交期，听完您做个判断。",
      "您好，我是米思米的，您收到我们的报价了吗？",
      "张总，上次的报价便宜了不少，您要不要下单？"
    ],
    correct: 1,
    explanation: "选项B完整包含三个P：<br>✅ <strong>Purpose</strong>：确认报价单里2个型号的交期<br>✅ <strong>Process</strong>：只需2分钟<br>✅ <strong>Payoff</strong>：听完您做个判断（给决策权）<br><br>注意，追单的Purpose要具体：不是泛泛「问考虑得怎么样」，而是<strong>具体聚焦到交期确认</strong>，降低了客户的回答难度。"
  },
  {
    type: "缺P识别",
    scenario: { role: "企微消息", text: "中心营业小张给一位潜在客户发了一条微信消息：“您好，我是米思米小张，最近天气炎热，注意防暑降温！”然后客户再也没回复。" },
    text: "从PPP模型来看，这条消息最大的问题是什么？",
    options: [
      "寒暄太泛泛，没有体现专业性",
      "缺少Purpose（目的）和Payoff（收益），客户不知道你想要什么",
      "不应该先发寒暄，应该直接说正事",
      "消息太短，客户感受不到诚意"
    ],
    correct: 1,
    explanation: "这条消息<strong>有寒暄，无实质内容</strong>——三个P全部缺失：<br>❌ <strong>Purpose</strong>：没有说明联系原因<br>❌ <strong>Process</strong>：没有时间承诺<br>❌ <strong>Payoff</strong>：没有说明对客户的好处<br><br>寒暄可以，但要<strong>在PPP说完之后自然带出</strong>：<br>「张总您好，我是米思米中心营业小张，近期导轨价格下调15%（Purpose），只需2分钟跟您同步下（Process），听完您判断是否值得参考（Payoff）。对了，最近高温天气注意防暑！」"
  },
  {
    type: "话术判断",
    text: "在PPP模型中，Payoff（收益）是最重要还是最容易被忽视的？以下说法正确的是：",
    options: [
      "Purpose最重要，因为要说明为什么联系",
      "Process最重要，因为客户最关心时间成本",
      "Payoff最重要，因为没有收益承诺客户没有动力听下去",
      "三个P同等重要，缺一不可，但Payoff是学员最容易忘记说的"
    ],
    correct: 3,

let current = 0;
let selected = null;
let answers = [];

function startQuiz() {
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('quizContent').classList.add('active');
  current = 0;
  answers = [];
  renderQuestion();
}

function renderQuestion() {
  const q = questions[current];
  selected = null;

  document.getElementById('qBadge').textContent = '第 ' + (current+1) + ' 题';
  document.getElementById('progressLabel').textContent = '第 ' + (current+1) + ' / ' + questions.length + ' 题';
  document.getElementById('progressFill').style.width = ((current+1)/questions.length*100) + '%';

  document.getElementById('qType').textContent = q.type;
  document.getElementById('qType').style.display = 'inline-block';
  document.getElementById('qText').innerHTML = q.text;

  // Scenario
  if (q.scenario) {
    document.getElementById('scenarioBox').style.display = 'block';
    document.getElementById('roleTag').textContent = q.scenario.role;
    document.getElementById('scenarioText').textContent = q.scenario.text;
  } else {
    document.getElementById('scenarioBox').style.display = 'none';
  }

  // Options
  const letters = ['A', 'B', 'C', 'D'];
  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  q.options.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.innerHTML = '<div class="opt-letter">' + letters[i] + '</div><div class="opt-text">' + opt + '</div>';
    div.onclick = () => selectOption(i);
    container.appendChild(div);
  });

  document.getElementById('explanation').classList.remove('show');
  document.getElementById('explanation').innerHTML = '';
  document.getElementById('submitBtn').style.display = '';
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('nextBtn').style.display = 'none';
}

function selectOption(i) {
  const opts = document.querySelectorAll('.option');
  opts.forEach((o, idx) => {
    o.classList.remove('selected');
    if (idx === i) o.classList.add('selected');
  });
  selected = i;
  document.getElementById('submitBtn').disabled = false;
}

function submitAnswer() {
  if (selected === null) return;
  const q = questions[current];
  const isCorrect = selected === q.correct;
  answers.push({ q, selected, isCorrect });

  const opts = document.querySelectorAll('.option');
  opts.forEach((o, i) => {
    o.onclick = null;
    if (i === q.correct) o.classList.add('correct');
    else if (i === selected && !isCorrect) o.classList.add('wrong');
  });

  const expDiv = document.getElementById('explanation');
  const expType = isCorrect ? 'exp-correct' : 'exp-wrong';
  const expIcon = isCorrect ? '✅' : '⚠️';
  const expTitle = isCorrect ? '回答正确！' : '回答错误，正确答案是 ' + ['A','B','C','D'][q.correct];
  expDiv.className = 'explanation show ' + expType;
  expDiv.innerHTML = '<div class="exp-title">' + expIcon + ' ' + expTitle + '</div><p>' + q.explanation + '</p>';

  document.getElementById('submitBtn').style.display = 'none';
  document.getElementById('nextBtn').style.display = '';
  document.getElementById('nextBtn').textContent = current === questions.length - 1 ? '查看结果 →' : '下一题 →';
}

function nextQuestion() {
  current++;
  if (current >= questions.length) {
    showResults();
  } else {
    renderQuestion();
  }
}

function showResults() {
  document.getElementById('quizContent').classList.remove('active');
  document.getElementById('resultScreen').classList.add('show');

  const right = answers.filter(a => a.isCorrect).length;
  const wrong = answers.length - right;
  const pct = Math.round(right / answers.length * 100);

  document.getElementById('scoreNum').textContent = right;
  document.getElementById('statRight').textContent = right;
  document.getElementById('statWrong').textContent = wrong;
  document.getElementById('statScore').textContent = pct + '%';

  // Animate score ring
  document.getElementById('scoreRing').style.setProperty('--pct', pct + '%');

  let title = '';
  let sub = '';
  if (pct === 100) { title = '🎉 满分！PPP破冰已融会贯通'; sub = '三个P的核心逻辑你已经完全掌握，可以在实战中灵活运用了。'; }
  else if (pct >= 80) { title = '👍 优秀！PPP破冰已熟练'; sub = '核心要点基本掌握，建议重点强化Payoff（收益）的表达——这是最容易忘记的P。'; }
  else if (pct >= 60) { title = '💪 不错！还需要加强练习'; sub = '建议回顾模块1-2，重点练习：1）识别缺了哪个P；2）用具体数字做Payoff。'; }
  else { title = '📚 PPP破冰需要强化学习'; sub = '建议重新看一遍Day1模块1-2内容，特别是三个P各自的消除对象和话术模板。'; }

  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultSub').textContent = sub;

  // Build review list
  const reviewList = document.getElementById('reviewList');
  reviewList.innerHTML = '';
  answers.forEach((a, i) => {
    const item = document.createElement('div');
    item.className = 'review-item ' + (a.isCorrect ? 'right' : 'wrong');
    item.innerHTML = '<div class="review-q">第' + (i+1) + '题 · ' + a.q.type + '</div>' +
      '<div class="review-answer">' + (a.isCorrect ? '✅ 正确' : '❌ 你的答案：' + ['A','B','C','D'][a.selected] + '｜正确答案：' + ['A','B','C','D'][a.q.correct]) + '</div>' +
      '<div class="review-exp">' + a.q.explanation.replace(/<br>/g, ' ') + '</div>';
    reviewList.appendChild(item);
  });
}

function restartQuiz() {
  document.getElementById('resultScreen').classList.remove('show');
  document.getElementById('startScreen').classList.remove('hidden');
}
</script>
